name: hermes-agent
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - '8642:8642'
    volumes:
      - /DATA/AppData/hermes-agent/data:/opt/data
    networks:
      - hermes-net
    environment:
      GATEWAY_ALLOW_ALL_USERS: 'true'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    user: root
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    x-casaos:
      envs:
        - container: GATEWAY_ALLOW_ALL_USERS
          description:
            en_US: Toggles unrestricted user access to the gateway.
            zh_CN: 切换不受限制的用户访问网关。
            ja_JP: ゲートウェイへの無制限のユーザーアクセスを切り替えます。
            de_DE: Schaltet den uneingeschränkten Benutzerzugriff auf das Gateway um.
            fr_FR: Permet d'activer l'accès illimité des utilisateurs à la passerelle.
            ko_KR: 게이트웨이에 대한 무제한 사용자 액세스를 토글합니다.
            ru_RU: Отключает неограниченный доступ пользователей к шлюзу.
            it_IT: Attiva l'accesso illimitato degli utenti al gateway.
            pt_PT: Alterna o acesso irrestrito do utilizador ao gateway.
            sv_SE: Kopplar till obegränsad användaråtkomst till gatewayen.
            nb_NO: Slår på ubegrenset brukertilgang til gatewayen.
            tr_TR: Ağ geçidine kısıtlanmamış kullanıcı erişimini açar.
            el_GR: Ενεργοποιεί την απεριόριστη πρόσβαση του χρήστη στην πύλη.
            hr_HR: Uključuje ili isključuje neograničeni pristup korisnika pristupniku.
            en_GB: Toggles unrestricted user access to the gateway.
        - container: TELEGRAM_BOT_TOKEN
          description:
            en_US: API token for optional Telegram bot integration.
            zh_CN: 用于可选 Telegram 机器人集成的 API 标记。
            ja_JP: オプションのTelegramボット統合用APIトークン。
            de_DE: API-Token für optionale Telegram-Bot-Integration.
            fr_FR: Jeton API pour l'intégration optionnelle du robot Telegram.
            ko_KR: 선택적 텔레그램 봇 통합을 위한 API 토큰입니다.
            ru_RU: API-токен для дополнительной интеграции бота Telegram.
            it_IT: Token API per l'integrazione opzionale del bot Telegram.
            pt_PT: Token da API para integração opcional do bot do Telegram.
            sv_SE: API-token för valfri integration av Telegram-bot.
            nb_NO: API-token for valgfri Telegram-botintegrasjon.
            tr_TR: İsteğe bağlı Telegram bot entegrasyonu için API belirteci.
            el_GR: Κουπόνι API για προαιρετική ενσωμάτωση του Telegram bot.
            hr_HR: API token za opcionalnu integraciju Telegram bota.
            en_GB: API token for optional Telegram bot integration.
      ports:
        - container: '8642'
          description:
            en_US: Primary web interface and gateway API port.
            zh_CN: 主网络接口和网关 API 端口。
            ja_JP: プライマリWebインターフェースとゲートウェイAPIポート。
            de_DE: Primäre Webschnittstelle und Gateway-API-Port.
            fr_FR: Interface web principale et port API de la passerelle.
            ko_KR: 기본 웹 인터페이스 및 게이트웨이 API 포트.
            ru_RU: Основной веб-интерфейс и порт API шлюза.
            it_IT: Interfaccia web primaria e porta API del gateway.
            pt_PT: Interface Web principal e porta API do gateway.
            sv_SE: Primärt webbgränssnitt och API-port för gateway.
            nb_NO: Primært webgrensesnitt og API-port for gateway.
            tr_TR: Birincil web arayüzü ve ağ geçidi API bağlantı noktası.
            el_GR: Πρωτεύουσα διεπαφή web και θύρα API πύλης.
            hr_HR: Port primarnog web sučelja i API-ja pristupnika.
            en_GB: Primary web interface and gateway API port.
      volumes:
        - container: /opt/data
          description:
            en_US: Persistent storage for application data.
            zh_CN: 应用数据的持久存储。
            ja_JP: アプリケーションデータの永続的ストレージ。
            de_DE: Dauerhafter Speicher für Anwendungsdaten.
            fr_FR: Stockage permanent des données d'application.
            ko_KR: 애플리케이션 데이터를 위한 영구 저장소.
            ru_RU: Постоянное хранилище для данных приложения.
            it_IT: Archiviazione persistente per i dati delle applicazioni.
            pt_PT: Armazenamento persistente para dados de aplicações.
            sv_SE: Beständig lagring av applikationsdata.
            nb_NO: Vedvarende lagring av applikasjonsdata.
            tr_TR: Uygulama verileri için kalıcı depolama.
            el_GR: Επίμονη αποθήκευση για δεδομένα εφαρμογών.
            hr_HR: Trajno spremište za podatke aplikacije.
            en_GB: Persistent storage for application data.
  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - '9119:9119'
    volumes:
      - /DATA/AppData/hermes-agent/data:/opt/data
    environment:
      GATEWAY_HEALTH_URL: http://hermes:8642
    networks:
      - hermes-net
    depends_on:
      - hermes
    user: root
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    x-casaos:
      envs:
        - container: GATEWAY_HEALTH_URL
          description:
            en_US: URL endpoint for checking the gateway service health status.
            zh_CN: 用于检查网关服务健康状态的 URL 端点。
            ja_JP: ゲートウェイ・サービスのヘルス・ステータスをチェックするためのURLエンドポイント。
            de_DE: URL-Endpunkt zur Überprüfung des Status des Gateway-Dienstes.
            fr_FR: URL permettant de vérifier l'état de santé du service de la passerelle.
            ko_KR: 게이트웨이 서비스 상태 확인을 위한 URL 엔드포인트입니다.
            ru_RU: Конечная точка URL для проверки состояния работоспособности службы шлюза.
            it_IT: Endpoint URL per verificare lo stato di salute del servizio gateway.
            pt_PT: Ponto de extremidade URL para verificar o estado de funcionamento do serviço de gateway.
            sv_SE: URL-slutpunkt för kontroll av hälsostatus för gateway-tjänsten.
            nb_NO: URL-endepunkt for kontroll av gateway-tjenestens helsestatus.
            tr_TR: Ağ geçidi hizmetinin sistem durumunu kontrol etmek için URL uç noktası.
            el_GR: Τελικό σημείο URL για τον έλεγχο της κατάστασης υγείας της υπηρεσίας πύλης.
            hr_HR: URL endpoint za provjeru statusa zdravlja servisa pristupnika.
            en_GB: URL endpoint for checking the gateway service health status.
      ports:
        - container: '9119'
          description:
            en_US: Health dashboard web interface.
            zh_CN: 健康仪表盘网络界面。
            ja_JP: 健康ダッシュボードのウェブインターフェース。
            de_DE: Web-Schnittstelle des Gesundheits-Dashboards.
            fr_FR: Interface web du tableau de bord de la santé.
            ko_KR: 상태 대시보드 웹 인터페이스.
            ru_RU: Веб-интерфейс приборной панели здоровья.
            it_IT: Interfaccia web del cruscotto sanitario.
            pt_PT: Interface Web do painel de saúde.
            sv_SE: Webbgränssnitt för instrumentpanel för hälsa.
            nb_NO: Nettgrensesnitt for helsedashboard.
            tr_TR: Sağlık kontrol paneli web arayüzü.
            el_GR: Διαδικτυακή διεπαφή πίνακα ελέγχου υγείας.
            hr_HR: Web sučelje nadzorne ploče zdravlja.
            en_GB: Health dashboard web interface.
      volumes:
        - container: /opt/data
          description:
            en_US: Shared persistent storage mounted for dashboard state access.
            zh_CN: 为仪表盘状态访问而安装的共享持久存储。
            ja_JP: ダッシュボードの状態アクセス用にマウントされた共有永続ストレージ。
            de_DE: Gemeinsamer dauerhafter Speicher für den Zugriff auf den Zustand des Dashboards.
            fr_FR: Stockage persistant partagé monté pour l'accès à l'état du tableau de bord.
            ko_KR: 대시보드 상태 액세스를 위해 마운트된 공유 영구 저장소입니다.
            ru_RU: Общее постоянное хранилище, установленное для доступа к состоянию приборной панели.
            it_IT: Memoria persistente condivisa montata per l'accesso allo stato del cruscotto.
            pt_PT: Armazenamento persistente partilhado montado para acesso ao estado do dashboard.
            sv_SE: Delad persistent lagring monterad för åtkomst till instrumentpanelens tillstånd.
            nb_NO: Delt vedvarende lagring montert for tilgang til dashbordstatus.
            tr_TR: Gösterge tablosu durumuna erişim için monte edilmiş paylaşılan kalıcı depolama.
            el_GR: Κοινή μόνιμη αποθήκευση τοποθετημένη για πρόσβαση στην κατάσταση του ταμπλό.
            hr_HR: Dijeljeno trajno spremište montirano za pristup stanju nadzorne ploče.
            en_GB: Shared persistent storage mounted for dashboard state access.
networks:
  hermes-net:
    driver: bridge
x-casaos:
  title:
    en_US: Hermes Agent
    zh_CN: 爱马仕代理
    ja_JP: ヘルメス代理店
    de_DE: Hermes-Agent
    fr_FR: Agent Hermes
    ko_KR: 헤르메스 에이전트
    ru_RU: Агент Гермеса
    it_IT: Agente Hermes
    pt_PT: Agente Hermes
    sv_SE: Hermes Agent
    nb_NO: Hermes Agent
    tr_TR: Hermes Ajan
    el_GR: Πράκτορας Hermes
    hr_HR: Hermes Agent
    en_GB: Hermes Agent
  tagline:
    en_US: Self-hosted AI agent gateway with a monitoring dashboard.
    zh_CN: 自托管人工智能代理网关，配有监控仪表板。
    ja_JP: 監視ダッシュボードを備えたセルフホスト型AIエージェントゲートウェイ。
    de_DE: Selbstgehostetes KI-Agenten-Gateway mit einem Überwachungs-Dashboard.
    fr_FR: Passerelle d'agent d'IA auto-hébergée avec un tableau de bord de surveillance.
    ko_KR: 모니터링 대시보드가 있는 자체 호스팅 AI 에이전트 게이트웨이.
    ru_RU: Самостоятельный шлюз для агентов искусственного интеллекта с панелью мониторинга.
    it_IT: Gateway di agenti AI in hosting con dashboard di monitoraggio.
    pt_PT: Gateway de agente de IA auto-hospedado com um painel de controlo.
    sv_SE: Gateway för AI-agenter med egen värd och instrumentpanel för övervakning.
    nb_NO: Selvbetjent AI-agent-gateway med et overvåkingsinstrumentbord.
    tr_TR: İzleme panosuna sahip, kendi kendine barındırılan yapay zeka aracı ağ geçidi.
    el_GR: Αυτοδιαχειριζόμενη πύλη πρακτόρων AI με πίνακα ελέγχου.
    hr_HR: Samostalno hostani pristupnik AI agenta s nadzornom pločom.
    en_GB: Self-hosted AI agent gateway with a monitoring dashboard.
  description:
    en_US: |-
      Hermes Agent deploys a gateway and a companion dashboard from the Nous Research image. The gateway service listens on port 8642 and stores data under /opt/data. The dashboard service listens on port 9119, depends on the gateway, and mounts the same /opt/data path for shared state.

      Key features:
      - Primary web interface exposed on port 8642
      - Health dashboard available on port 9119
      - Shared persistent storage at /opt/data
      - Optional Telegram bot integration via TELEGRAM_BOT_TOKEN
      - User access toggled with GATEWAY_ALLOW_ALL_USERS
    zh_CN: |-
      Hermes Agent 从 Nous Research 图像中部署了网关和配套仪表盘。网关服务监听端口为 8642，数据存储在 /opt/data 下。仪表盘服务监听端口为 9119，依赖于网关，并为共享状态挂载相同的 /opt/data 路径。

      主要功能
      - 主网络接口暴露在 8642 端口上
      - 通过端口 9119 提供健康仪表板
      - 在 /opt/data 上共享持久存储
      - 通过 TELEGRAM_BOT_TOKEN 实现可选的 Telegram 机器人集成
      - 通过 GATEWAY_ALLOW_ALL_USERS 切换用户访问权限
    ja_JP: |-
      Hermes Agent は Nous Research イメージからゲートウェイとコンパニオンダッシュボードをデプロイします。ゲートウェイ・サービスはポート 8642 でリッスンし、/opt/data にデータを保存します。ダッシュボードサービスはポート 9119 でリッスンし、ゲートウェイに依存し、共有状態のために同じ /opt/data パスをマウントします。

      主な機能
      - ポート8642で公開されるプライマリWebインターフェース
      - ポート9119で利用可能なヘルス・ダッシュボード
      - opt/dataの共有永続ストレージ
      - TELEGRAM_BOT_TOKENによるTelegramボットの統合（オプション
      - GATEWAY_ALLOW_ALL_USERSでユーザーアクセスを切り替え可能
    de_DE: |-
      Hermes Agent setzt ein Gateway und ein dazugehöriges Dashboard aus dem Nous Research Image ein. Der Gateway-Dienst lauscht auf Port 8642 und speichert Daten unter /opt/data. Der Dashboard-Dienst lauscht auf Port 9119, hängt vom Gateway ab und hängt denselben /opt/data-Pfad für den gemeinsamen Status ein.

      Hauptmerkmale:
      - Primäre Webschnittstelle auf Port 8642
      - Health Dashboard verfügbar auf Port 9119
      - Gemeinsamer dauerhafter Speicher unter /opt/data
      - Optionale Telegram-Bot-Integration über TELEGRAM_BOT_TOKEN
      - Benutzerzugang umschaltbar mit GATEWAY_ALLOW_ALL_USERS
    fr_FR: |-
      Hermes Agent déploie une passerelle et un tableau de bord compagnon à partir de l'image de Nous Research. Le service de passerelle écoute sur le port 8642 et stocke les données sous /opt/data. Le service de tableau de bord écoute sur le port 9119, dépend de la passerelle et monte le même chemin /opt/data pour l'état partagé.

      Caractéristiques principales :
      - Interface web principale exposée sur le port 8642
      - Tableau de bord de santé disponible sur le port 9119
      - Stockage persistant partagé sur /opt/data
      - Intégration optionnelle d'un bot Telegram via TELEGRAM_BOT_TOKEN
      - Accès des utilisateurs avec GATEWAY_ALLOW_ALL_USERS
    ko_KR: |-
      Hermes 에이전트는 Nous Research 이미지에서 게이트웨이와 컴패니언 대시보드를 배포합니다. 게이트웨이 서비스는 포트 8642에서 수신 대기하고 /opt/data 아래에 데이터를 저장합니다. 대시보드 서비스는 포트 9119에서 수신 대기하고 게이트웨이에 따라 다르며 공유 상태에 대해 동일한 /opt/data 경로를 마운트합니다.

      주요 기능:
      - 포트 8642에 노출되는 기본 웹 인터페이스
      - 포트 9119에서 상태 대시보드 사용 가능
      - 옵트/데이터에 공유 영구 저장소 제공
      - 텔레그램_봇_토큰을 통한 텔레그램 봇 통합(옵션)
      - GATEWAY_ALLOW_ALL_USERS로 사용자 액세스 토글
    ru_RU: |-
      Hermes Agent развертывает шлюз и сопутствующую приборную панель из образа Nous Research. Служба шлюза прослушивает порт 8642 и хранит данные в каталоге /opt/data. Служба приборной панели прослушивает порт 9119, зависит от шлюза и монтирует тот же путь /opt/data для общего состояния.

      Ключевые особенности:
      - Основной веб-интерфейс открыт на порту 8642
      - Приборная панель здоровья доступна на порту 9119.
      - Общее постоянное хранилище в /opt/data
      - Дополнительная интеграция с ботом Telegram через TELEGRAM_BOT_TOKEN
      - Доступ пользователей регулируется с помощью GATEWAY_ALLOW_ALL_USERS
    it_IT: |-
      Hermes Agent distribuisce un gateway e un dashboard di accompagnamento dall'immagine di Nous Research. Il servizio gateway è in ascolto sulla porta 8642 e memorizza i dati in /opt/data. Il servizio del dashboard è in ascolto sulla porta 9119, dipende dal gateway e monta lo stesso percorso /opt/data per lo stato condiviso.

      Caratteristiche principali:
      - Interfaccia web primaria esposta sulla porta 8642
      - Cruscotto sanitario disponibile sulla porta 9119
      - Archiviazione persistente condivisa su /opt/data
      - Integrazione opzionale del bot Telegram tramite TELEGRAM_BOT_TOKEN
      - Accesso degli utenti regolato con GATEWAY_ALLOW_ALL_USERS
    pt_PT: |-
      O Hermes Agent implanta um gateway e um painel de controle complementar a partir da imagem do Nous Research. O serviço de gateway escuta na porta 8642 e armazena dados em /opt/data. O serviço de dashboard escuta na porta 9119, depende do gateway e monta o mesmo caminho /opt/data para estado compartilhado.

      Principais caraterísticas:
      - Interface Web primária exposta na porta 8642
      - Painel de controlo de saúde disponível na porta 9119
      - Armazenamento persistente partilhado em /opt/data
      - Integração opcional do bot do Telegram através do TELEGRAM_BOT_TOKEN
      - Acesso do utilizador alternado com GATEWAY_ALLOW_ALL_USERS
    sv_SE: |-
      Hermes Agent distribuerar en gateway och en kompletterande instrumentpanel från Nous Research-bilden. Gateway-tjänsten lyssnar på port 8642 och lagrar data under /opt/data. Instrumentpaneltjänsten lyssnar på port 9119, är beroende av gatewayen och monterar samma /opt/data-sökväg för delat tillstånd.

      Viktiga funktioner:
      - Primärt webbgränssnitt exponerat på port 8642
      - Instrumentpanel för hälsa tillgänglig på port 9119
      - Delad beständig lagring på /opt/data
      - Valfri integration av Telegram-bot via TELEGRAM_BOT_TOKEN
      - Användaråtkomst växlas med GATEWAY_ALLOW_ALL_USERS
    nb_NO: |-
      Hermes Agent distribuerer en gateway og et tilhørende dashbord fra Nous Research-imaget. Gateway-tjenesten lytter på port 8642 og lagrer data under /opt/data. Dashboard-tjenesten lytter på port 9119, er avhengig av gatewayen og monterer den samme /opt/data-banen for delt tilstand.

      Viktige funksjoner:
      - Primært webgrensesnitt eksponert på port 8642
      - Helsedashbord tilgjengelig på port 9119
      - Delt vedvarende lagring på /opt/data
      - Valgfri Telegram-botintegrasjon via TELEGRAM_BOT_TOKEN
      - Brukertilgang kan veksles mellom med GATEWAY_ALLOW_ALL_USERS
    tr_TR: |-
      Hermes Agent, Nous Research görüntüsünden bir ağ geçidi ve tamamlayıcı bir gösterge tablosu dağıtır. Ağ geçidi hizmeti 8642 numaralı bağlantı noktasını dinler ve verileri /opt/data altında depolar. Gösterge tablosu hizmeti 9119 numaralı bağlantı noktasını dinler, ağ geçidine bağlıdır ve paylaşılan durum için aynı /opt/data yolunu bağlar.

      Temel özellikler:
      - Port 8642'ye maruz kalan birincil web arayüzü
      - Sağlık kontrol paneli 9119 numaralı bağlantı noktasında kullanılabilir
      - /opt/data adresinde paylaşılan kalıcı depolama
      - TELEGRAM_BOT_TOKEN aracılığıyla isteğe bağlı Telegram bot entegrasyonu
      - Kullanıcı erişimi GATEWAY_ALLOW_ALL_USERS ile değiştirilir
    el_GR: |-
      Ο Hermes Agent αναπτύσσει μια πύλη και ένα συνοδευτικό ταμπλό από την εικόνα της Nous Research. Η υπηρεσία πύλης ακούει στη θύρα 8642 και αποθηκεύει δεδομένα στο /opt/data. Η υπηρεσία dashboard ακούει στη θύρα 9119, εξαρτάται από την πύλη και προσαρτά την ίδια διαδρομή /opt/data για κοινή κατάσταση.

      Βασικά χαρακτηριστικά:
      - Πρωταρχική διεπαφή ιστού που εκτίθεται στη θύρα 8642
      - Πίνακας ελέγχου υγείας διαθέσιμος στη θύρα 9119
      - Κοινή μόνιμη αποθήκευση στη διεύθυνση /opt/data
      - Προαιρετική ενσωμάτωση bot Telegram μέσω TELEGRAM_BOT_TOKEN
      - Πρόσβαση χρηστών που ρυθμίζεται με το GATEWAY_ALLOW_ALL_USERS
    hr_HR: |-
      Hermes Agent implementira pristupnik i prateću nadzornu ploču iz slike Nous Research. Servis pristupnika osluškuje na portu 8642 i pohranjuje podatke u /opt/data. Servis nadzorne ploče osluškuje na portu 9119, ovisi o pristupniku te montira istu putanju /opt/data za dijeljeno stanje.

      Ključne značajke:
      - Primarno web sučelje izloženo na portu 8642
      - Nadzorna ploča zdravlja dostupna na portu 9119
      - Dijeljeno trajno spremište na /opt/data
      - Opcionalna integracija Telegram bota putem TELEGRAM_BOT_TOKEN
      - Korisnički pristup uključuje/isključuje se pomoću GATEWAY_ALLOW_ALL_USERS
    en_GB: |-
      Hermes Agent deploys a gateway and a companion dashboard from the Nous Research image. The gateway service listens on port 8642 and stores data under /opt/data. The dashboard service listens on port 9119, depends on the gateway, and mounts the same /opt/data path for shared state.

      Key features:
      - Primary web interface exposed on port 8642
      - Health dashboard available on port 9119
