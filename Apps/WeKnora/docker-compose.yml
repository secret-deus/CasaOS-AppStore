name: weknora
services:
  weknora:
    image: wechatopenai/weknora-ui:latest
    container_name: weknora
    ports:
      - target: 80
        published: "1080"
        protocol: tcp
    environment:
      - MAX_FILE_SIZE_MB=50
    depends_on:
      app:
        condition: service_healthy
    networks:
      - weknora-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
    x-casaos:
      envs:
        - container: MAX_FILE_SIZE_MB
          description:
            de_DE: Maximum file size allowed for upload in megabytes
            el_GR: Maximum file size allowed for upload in megabytes
            en_GB: Maximum file size allowed for upload in megabytes
            en_US: Maximum file size allowed for upload in megabytes
            fr_FR: Maximum file size allowed for upload in megabytes
            hr_HR: Maximum file size allowed for upload in megabytes
            it_IT: Maximum file size allowed for upload in megabytes
            ja_JP: Maximum file size allowed for upload in megabytes
            ko_KR: Maximum file size allowed for upload in megabytes
            nb_NO: Maximum file size allowed for upload in megabytes
            pt_PT: Maximum file size allowed for upload in megabytes
            ru_RU: Maximum file size allowed for upload in megabytes
            sv_SE: Maximum file size allowed for upload in megabytes
            tr_TR: Maximum file size allowed for upload in megabytes
            zh_CN: Maximum file size allowed for upload in megabytes
      ports:
        - container: "80"
          description:
            de_DE: Haupt-Weboberflächen-Port
            el_GR: Main web interface port
            en_GB: Main web interface port
            en_US: Main web interface port
            fr_FR: Main web interface port
            hr_HR: Main web interface port
            it_IT: Main web interface port
            ja_JP: Main web interface port
            ko_KR: Main web interface port
            nb_NO: Main web interface port
            pt_PT: Main web interface port
            ru_RU: Main web interface port
            sv_SE: Main web interface port
            tr_TR: Main web interface port
            zh_CN: 主 Web 界面端口
  app:
    image: wechatopenai/weknora-app:latest
    container_name: weknora-app
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/files
        target: /data/files
    deploy:
      resources:
        reservations:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=WeKnora
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PROPAGATORS=tracecontext,baggage
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - QDRANT_COLLECTION=weknora_embeddings
      - QDRANT_API_KEY=
      - QDRANT_USE_TLS=false
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadmin
      - MINIO_BUCKET_NAME=weknora
      - ENABLE_GRAPH_RAG=true
      - NEO4J_ENABLE=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - GIN_MODE=release
      - DISABLE_REGISTRATION=false
      - DB_DRIVER=postgres
      - DB_HOST=weknora-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123!@#
      - DB_NAME=WeKnora
      - TZ=$TZ
      - RETRIEVE_DRIVER=postgres
      - DOCREADER_ADDR=weknora-docreader:50051
      - STORAGE_TYPE=minio
      - LOCAL_STORAGE_BASE_DIR=/data/files
      - AUTO_RECOVER_DIRTY=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - STREAM_MANAGER_TYPE=redis
      - REDIS_ADDR=weknora-redis:6379
      - REDIS_PASSWORD=redis123!@#
      - REDIS_DB=0
      - REDIS_PREFIX="stream:"
      - TENANT_AES_KEY=weknorarag-api-key-secret-secret
      - CONCURRENCY_POOL_SIZE:5
      - JWT_SECRET=weknora-jwt-secret
      - MAX_FILE_SIZE_MB=50
    depends_on:
      weknora-redis:
        condition: service_started
      weknora-postgres:
        condition: service_healthy
      weknora-docreader:
        condition: service_healthy
    networks:
      - weknora-network
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    x-casaos:
      envs:
        - container: GIN_MODE
