    fr_FR: |-
      WeKnora est un framework de compréhension approfondie de documents et de récupération sémantique basé sur les grands modèles de langage (LLM), spécifiquement conçu pour les scénarios de documents avec des structures complexes et un contenu hétérogène. Il adopte une architecture modulaire, intégrant des technologies clés telles que le prétraitement multimodal, l'indexation vectorielle sémantique, la récupération intelligente et l'inférence de grands modèles. Basé sur le paradigme de génération augmentée par récupération (RAG), il offre des capacités de questions-réponses de haute qualité et sensibles au contexte. WeKnora peut comprendre en profondeur le contenu des documents dans différents formats, combiner des fragments de documents pertinents avec l'inférence du modèle de langage et produire des résultats sémantiques précis et cohérents.

      **Fonctionnalités Clés:**
      - Les fonctions principales de WeKnora couvrent l'ensemble du flux de travail de traitement intelligent de documents et de questions-réponses:
      - Analyse Multimodale Approfondie: Prend en charge l'extraction de contenu structuré à partir de divers formats tels que PDF, Word, TXT, images, y compris la reconnaissance de texte d'image OCR.
      - Indexation Vectorielle Sémantique et Récupération Intelligente: Atteint une correspondance sémantique et un rappel de haute précision grâce à une combinaison de récupération vectorielle, de récupération par mots-clés et même de récupération améliorée par graphe de connaissances.
      - Génération de Questions-Réponses en Boucle Fermée RAG: Génère des réponses de contenu précises et cohérentes en tirant parti de l'inférence de grands modèles de langage et de la fusion de fragments de récupération.
      - Capacités Améliorées en Mode Agent: Prend en charge le mode ReACT Agent, qui peut appeler des outils intégrés, la recherche web externe, etc., lors d'itérations multi-tours, pour améliorer les capacités de traitement des tâches complexes.
      - Gestion de Bases de Connaissances Multi-types: Peut créer des bases de connaissances de type FAQ et document, et gérer de manière flexible les étiquettes, l'importation par lots de fichiers ou d'URL.
      - Stratégie de Dialogue et Interface Utilisateur Configurables: Fournit une interface Web intuitive et une API REST, permettant l'ajustement en ligne des modèles, des seuils de récupération et de Prompt pour contrôler le comportement du dialogue.

      **En savoir plus:**
      [Site Officiel](https://weknora.weixin.qq.com)
      [Lien GitHub](https://github.com/Tencent/WeKnora)
    hr_HR: |-
      WeKnora je okvir za dubinsko razumijevanje dokumenata i semantičko dohvaćanje temeljen na velikim jezičnim modelima (LLM), posebno dizajniran za scenarije dokumenata sa složenim strukturama i heterogenim sadržajem. Usvaja modularnu arhitekturu, integrirajući ključne tehnologije kao što su multimodalna predobrada, semantičko vektorsko indeksiranje, inteligentno dohvaćanje i zaključivanje velikih modela. Temeljen na paradigmi Retrieval-Augmented Generation (RAG), postiže kontekstualno svjesne, visokokvalitetne mogućnosti pitanja i odgovora. WeKnora može duboko razumjeti sadržaj dokumenata u različitim formatima, kombinirati relevantne fragmente dokumenata sa zaključivanjem jezičnog modela i isporučiti točne, koherentne semantičke rezultate.

      **Ključne značajke:**
      - Osnovne funkcije WeKnore pokrivaju cjelokupni tijek rada inteligentne obrade dokumenata i pitanja i odgovora:
      - Multimodalno dubinsko parsiranje: Podržava ekstrakciju strukturiranog sadržaja iz različitih formata kao što su PDF, Word, TXT, slike, uključujući OCR prepoznavanje teksta na slikama.
      - Semantičko vektorsko indeksiranje i inteligentno dohvaćanje: Postiže visoku preciznost semantičkog podudaranja i opoziva kroz kombinaciju vektorskog dohvaćanja, dohvaćanja ključnih riječi, pa čak i dohvaćanja poboljšanog grafom znanja.
      - RAG generiranje pitanja i odgovora zatvorene petlje: Generira točne i koherentne odgovore na sadržaj iskorištavanjem zaključivanja velikog jezičnog modela i fuzije fragmenata dohvaćanja.
      - Poboljšane mogućnosti agentskog načina rada: Podržava ReACT Agent način rada, koji može pozivati ugrađene alate, vanjsko web pretraživanje itd., tijekom višestrukih iteracija, kako bi poboljšao mogućnosti obrade složenih zadataka.
      - Upravljanje bazom znanja više vrsta: Može stvarati baze znanja tipa FAQ i dokumenata, te fleksibilno upravljati oznakama, skupnim uvozom datoteka ili URL-ova.
      - Konfigurabilna strategija dijaloga i korisničko sučelje: Pruža intuitivno web sučelje i REST API, omogućujući online prilagodbu modela, pragova dohvaćanja i Prompt za kontrolu ponašanja dijaloga.

      **Saznajte više:**
      [Službena web stranica](https://weknora.weixin.qq.com)
      [GitHub poveznica](https://github.com/Tencent/WeKnora)
    it_IT: |-
      WeKnora è un framework di comprensione profonda dei documenti e di recupero semantico basato su Large Language Models (LLM), specificamente progettato per scenari documentali con strutture complesse e contenuti eterogenei. Adotta un'architettura modulare, integrando tecnologie chiave come la pre-elaborazione multimodale, l'indicizzazione vettoriale semantica, il recupero intelligente e l'inferenza di modelli di grandi dimensioni. Basato sul paradigma Retrieval-Augmented Generation (RAG), raggiunge capacità di Q&A di alta qualità e sensibili al contesto. WeKnora può comprendere in profondità il contenuto dei documenti in diversi formati, combinare frammenti di documenti pertinenti con l'inferenza del modello linguistico e produrre risultati semantici accurati e coerenti.

      **Caratteristiche Principali:**
      - Le funzioni principali di WeKnora coprono l'intero flusso di lavoro di elaborazione intelligente dei documenti e di Q&A:
      - Parsing Profondo Multimodale: Supporta l'estrazione di contenuti strutturati da vari formati come PDF, Word, TXT, immagini, inclusa la riconoscimento del testo delle immagini OCR.
      - Indicizzazione Vettoriale Semantica e Recupero Intelligente: Ottiene una corrispondenza semantica e un richiamo di alta precisione attraverso una combinazione di recupero vettoriale, recupero per parole chiave e persino recupero migliorato dal grafo della conoscenza.
      - Generazione Q&A a Ciclo Chiuso RAG: Genera risposte di contenuto accurate e coerenti sfruttando l'inferenza di modelli linguistici di grandi dimensioni e la fusione di frammenti di recupero.
      - Capacità Potenziate in Modalità Agente: Supporta la modalità ReACT Agent, che può richiamare strumenti integrati, ricerca web esterna, ecc., durante iterazioni multi-round, per migliorare le capacità di elaborazione di attività complesse.
      - Gestione di Basi di Conoscenza Multi-tipo: Può creare basi di conoscenza di tipo FAQ e documentale, e gestire in modo flessibile tag, importazione in batch di file o URL.
      - Strategia di Dialogo e UI Configurabili: Fornisce un'interfaccia Web intuitiva e REST API, consentendo la regolazione online di modelli, soglie di recupero e Prompt per controllare il comportamento del dialogo.

      **Scopri di più:**
      [Sito Ufficiale](https://weknora.weixin.qq.com)
      [Link GitHub](https://github.com/Tencent/WeKnora)
    ja_JP: |-
      WeKnoraは、大規模言語モデル（LLM）に基づいた、深い文書理解と意味検索フレームワークであり、複雑な構造と異種コンテンツを持つ文書シナリオのために特別に設計されています。マルチモーダル前処理、意味ベクトルインデックス作成、インテリジェント検索、大規模モデル推論などの主要技術を統合したモジュラーアーキテクチャを採用しています。Retrieval-Augmented Generation（RAG）パラダイムに基づいて、コンテキストを認識した高品質なQ&A機能を実現します。WeKnoraは、異なる形式の文書コンテンツを深く理解し、関連する文書フラグメントと言語モデル推論を組み合わせ、正確で一貫性のある意味結果を出力できます。

      **主な機能:**
      - WeKnoraのコア機能は、インテリジェントな文書処理とQ&Aワークフロー全体をカバーしています。
      - マルチモーダル深層解析: PDF、Word、TXT、画像などのさまざまな形式からの構造化コンテンツ抽出をサポートし、OCR画像テキスト認識も含まれます。
      - 意味ベクトルインデックス作成とインテリジェント検索: ベクトル検索、キーワード検索、さらには知識グラフ強化検索の組み合わせにより、高精度な意味マッチングとリコールを実現します。
      - RAGクローズドループQ&A生成: 大規模言語モデル推論と検索フラグメント融合を活用して、正確で一貫性のあるコンテンツ回答を生成します。
      - エージェントモード強化機能: ReACT Agentモードをサポートし、多段階の反復中に組み込みツール、外部ウェブ検索などを呼び出すことで、複雑なタスク処理能力を向上させることができます。
      - 多種知識ベース管理: FAQおよび文書タイプの知識ベースを作成し、タグ、ファイルまたはURLの一括インポートを柔軟に管理できます。
      - 設定可能な対話戦略とUI: 直感的なWebインターフェースとREST APIを提供し、モデル、検索しきい値、およびPromptをオンラインで調整して対話動作を制御できます。

      **詳細はこちら:**
      [公式サイト](https://weknora.weixin.qq.com)
      [GitHubリンク](https://github.com/Tencent/WeKnora)
    ko_KR: |-
      WeKnora는 복잡한 구조와 이기종 콘텐츠를 가진 문서 시나리오를 위해 특별히 설계된 대규모 언어 모델(LLM) 기반의 심층 문서 이해 및 의미 검색 프레임워크입니다. 멀티모달 전처리, 의미 벡터 인덱싱, 지능형 검색 및 대규모 모델 추론과 같은 핵심 기술을 통합하는 모듈식 아키텍처를 채택합니다. 검색 증강 생성(RAG) 패러다임을 기반으로 컨텍스트 인식 및 고품질 Q&A 기능을 달성합니다. WeKnora는 다양한 형식의 문서 콘텐츠를 깊이 이해하고, 관련 문서 조각을 언어 모델 추론과 결합하여 정확하고 일관된 의미 결과를 출력할 수 있습니다.

      **주요 기능:**
      - WeKnora의 핵심 기능은 완전한 지능형 문서 처리 및 Q&A 워크플로우를 포괄합니다.
      - 멀티모달 심층 구문 분석: PDF, Word, TXT, 이미지 등 다양한 형식에서 구조화된 콘텐츠 추출을 지원하며, OCR 이미지 텍스트 인식도 포함합니다.
      - 의미 벡터 인덱싱 및 지능형 검색: 벡터 검색, 키워드 검색, 심지어 지식 그래프 강화 검색의 조합을 통해 고정밀 의미 매칭 및 재현을 달성합니다.
      - RAG 폐쇄 루프 Q&A 생성: 대규모 언어 모델 추론 및 검색 조각 융합을 활용하여 정확하고 일관된 콘텐츠 답변을 생성합니다.
      - 에이전트 모드 강화 기능: ReACT 에이전트 모드를 지원하여 다중 라운드 반복 중에 내장 도구, 외부 웹 검색 등을 호출하여 복잡한 작업 처리 기능을 향상시킬 수 있습니다.
      - 다중 유형 지식 기반 관리: FAQ 및 문서 유형 지식 기반을 생성하고, 태그, 파일 또는 URL의 일괄 가져오기를 유연하게 관리할 수 있습니다.
      - 구성 가능한 대화 전략 및 UI: 직관적인 웹 인터페이스 및 REST API를 제공하여 모델, 검색 임계값 및 Prompt를 온라인으로 조정하여 대화 동작을 제어할 수 있습니다.

      **더 알아보기:**
      [공식 웹사이트](https://weknora.weixin.qq.com)
      [GitHub 링크](https://github.com/Tencent/WeKnora)
    nb_NO: |-
      WeKnora er et rammeverk for dyp dokumentforståelse og semantisk gjenfinning basert på store språkmodeller (LLM), spesielt designet for dokumentscenarier med komplekse strukturer og heterogent innhold. Det vedtar en modulær arkitektur som integrerer nøkkelteknologier som multimodal forbehandling, semantisk vektorindeksering, intelligent gjenfinning og inferens av store modeller. Basert på Retrieval-Augmented Generation (RAG)-paradigmet oppnår det kontekstbevisste, høykvalitets Q&A-funksjoner. WeKnora kan dypt forstå dokumentinnhold i forskjellige formater, kombinere relevante dokumentfragmenter med språkmodellinferens, og produsere nøyaktige, sammenhengende semantiske resultater.

      **Nøkkelfunksjoner:**
      - WeKnoras kjernefunksjoner dekker hele arbeidsflyten for intelligent dokumentbehandling og Q&A:
      - Multimodal Dyp Parsing: Støtter strukturert innholdsekstraksjon fra ulike formater som PDF, Word, TXT, bilder, inkludert OCR-bildetekstgjenkjenning.
      - Semantisk Vektorindeksering og Intelligent Gjenfinning: Oppnår høypresisjons semantisk matching og gjenkalling gjennom en kombinasjon av vektorgjenfinning, nøkkelordsgjenfinning og til og med kunnskapsgraf-forbedret gjenfinning.
      - RAG Lukket Sløyfe Q&A-generering: Genererer nøyaktige og sammenhengende innholdsvar ved å utnytte inferens fra store språkmodeller og fusjon av gjenfinningsfragmenter.
      - Agentmodus Forbedrede Funksjoner: Støtter ReACT Agent-modus, som kan kalle innebygde verktøy, eksternt websøk osv., under flerruns-iterasjoner, for å forbedre behandlingskapasiteten for komplekse oppgaver.
      - Flertype Kunnskapsbasebehandling: Kan opprette FAQ- og dokumenttype kunnskapsbaser, og fleksibelt administrere tagger, masseimportere filer eller URL-er.
      - Konfigurerbar Dialogstrategi og UI: Gir et intuitivt webgrensesnitt og REST API, som tillater online justering av modeller, gjenfinningsterskler og Prompt for å kontrollere dialogatferd.

      **Lær mer:**
      [Offisiell nettside](https://weknora.weixin.qq.com)
      [GitHub-lenke](https://github.com/Tencent/WeKnora)
    pt_PT: |-
      WeKnora é uma estrutura de compreensão profunda de documentos e recuperação semântica baseada em Grandes Modelos de Linguagem (LLM), especificamente projetada para cenários de documentos com estruturas complexas e conteúdo heterogéneo. Adota uma arquitetura modular, integrando tecnologias chave como pré-processamento multimodal, indexação de vetores semânticos, recuperação inteligente e inferência de modelos grandes. Baseado no paradigma de Geração Aumentada por Recuperação (RAG), alcança capacidades de Q&A de alta qualidade e sensíveis ao contexto. WeKnora pode compreender profundamente o conteúdo de documentos em diferentes formatos, combinar fragmentos de documentos relevantes com inferência de modelo de linguagem e produzir resultados semânticos precisos e coerentes.

      **Principais Funcionalidades:**
      - As funções principais do WeKnora cobrem o fluxo de trabalho completo de processamento inteligente de documentos e Q&A:
      - Análise Multimodal Profunda: Suporta a extração de conteúdo estruturado de vários formatos, como PDF, Word, TXT, imagens, incluindo reconhecimento de texto de imagem OCR.
      - Indexação de Vetores Semânticos e Recuperação Inteligente: Alcança correspondência semântica e recuperação de alta precisão através de uma combinação de recuperação de vetores, recuperação de palavras-chave e até mesmo recuperação aprimorada por grafo de conhecimento.
      - Geração de Q&A em Ciclo Fechado RAG: Gera respostas de conteúdo precisas e coerentes, aproveitando a inferência de modelos de linguagem grandes e a fusão de fragmentos de recuperação.
      - Capacidades Aprimoradas do Modo Agente: Suporta o modo ReACT Agent, que pode chamar ferramentas incorporadas, pesquisa web externa, etc., durante iterações de várias rondas, para melhorar as capacidades de processamento de tarefas complexas.
      - Gestão de Base de Conhecimento Multi-tipo: Pode criar bases de conhecimento do tipo FAQ e documento, e gerir flexivelmente tags, importação em lote de ficheiros ou URLs.
      - Estratégia de Diálogo e UI Configuráveis: Fornece uma interface Web intuitiva e REST API, permitindo o ajuste online de modelos, limiares de recuperação e Prompt para controlar o comportamento do diálogo.

      **Saiba Mais:**
      [Website Oficial](https://weknora.weixin.qq.com)
      [Link GitHub](https://github.com/Tencent/WeKnora)
    ru_RU: |-
      WeKnora — это фреймворк для глубокого понимания документов и семантического поиска, основанный на больших языковых моделях (LLM), специально разработанный для сценариев работы с документами, имеющими сложные структуры и гетерогенное содержимое. Он использует модульную архитектуру, интегрируя ключевые технологии, такие как мультимодальная предварительная обработка, семантическое векторное индексирование, интеллектуальный поиск и вывод больших моделей. Основанный на парадигме Retrieval-Augmented Generation (RAG), он обеспечивает контекстно-зависимые, высококачественные возможности вопросов и ответов. WeKnora может глубоко понимать содержимое документов в различных форматах, комбинировать соответствующие фрагменты документов с выводом языковой модели и выдавать точные, связные семантические результаты.

      **Ключевые особенности:**
      - Основные функции WeKnora охватывают полный рабочий процесс интеллектуальной обработки документов и вопросов и ответов:
      - Мультимодальный глубокий парсинг: Поддерживает извлечение структурированного содержимого из различных форматов, таких как PDF, Word, TXT, изображения, включая распознавание текста на изображениях с помощью OCR.
      - Семантическое векторное индексирование и интеллектуальный поиск: Достигает высокоточной семантической сопоставимости и отзыва за счет комбинации векторного поиска, поиска по ключевым словам и даже поиска, улучшенного графом знаний.
      - Генерация вопросов и ответов с замкнутым циклом RAG: Генерирует точные и связные ответы на основе содержимого, используя вывод больших языковых моделей и слияние фрагментов поиска.
      - Расширенные возможности режима агента: Поддерживает режим ReACT Agent, который может вызывать встроенные инструменты, внешний веб-поиск и т. д. во время многораундовых итераций для улучшения возможностей обработки сложных задач.
      - Управление базами знаний различных типов: Может создавать базы знаний типа FAQ и документов, а также гибко управлять тегами, пакетным импортом файлов или URL-адресов.
      - Настраиваемая стратегия диалога и пользовательский интерфейс: Предоставляет интуитивно понятный веб-интерфейс и REST API, позволяя онлайн настраивать модели, пороги поиска и Prompt для управления поведением диалога.

      **Узнать больше:**
      [Официальный сайт](https://weknora.weixin.qq.com)
      [Ссылка на GitHub](https://github.com/Tencent/WeKnora)
    sv_SE: |-
      WeKnora är ett ramverk för djup dokumentförståelse och semantisk hämtning baserat på stora språkmodeller (LLM), speciellt utformat för dokumentscenarier med komplexa strukturer och heterogent innehåll. Det antar en modulär arkitektur som integrerar nyckelteknologier som multimodal förbehandling, semantisk vektorindexering, intelligent hämtning och inferens av stora modeller. Baserat på paradigmet Retrieval-Augmented Generation (RAG) uppnår det kontextmedvetna, högkvalitativa Q&A-funktioner. WeKnora kan djupt förstå dokumentinnehåll i olika format, kombinera relevanta dokumentfragment med språkmodellinferens och producera exakta, sammanhängande semantiska resultat.

      **Nyckelfunktioner:**
      - WeKnoras kärnfunktioner täcker hela arbetsflödet för intelligent dokumentbehandling och Q&A:
      - Multimodal Djup Parsning: Stöder extraktion av strukturerat innehåll från olika format som PDF, Word, TXT, bilder, inklusive OCR-bildtextigenkänning.
      - Semantisk Vektorindexering och Intelligent Hämtning: Uppnår högprecisions semantisk matchning och återkallning genom en kombination av vektorhämtning, nyckelordshämtning och till och med kunskapsgraf-förbättrad hämtning.
      - RAG Sluten Krets Q&A-generering: Genererar exakta och sammanhängande innehållssvar genom att utnyttja inferens från stora språkmodeller och fusion av hämtningsfragment.
      - Agentläge Förbättrade Funktioner: Stöder ReACT Agent-läge, som kan anropa inbyggda verktyg, extern webbsökning etc., under flerruns-iterationer, för att förbättra behandlingskapaciteten för komplexa uppgifter.
      - Flertyp Kunskapsbasishantering: Kan skapa FAQ- och dokumenttyp kunskapsbaser, och flexibelt hantera taggar, massimport av filer eller URL:er.
      - Konfigurerbar Dialogstrategi och UI: Tillhandahåller ett intuitivt webbgränssnitt och REST API, vilket möjliggör onlinejustering av modeller, hämtningströsklar och Prompt för att kontrollera dialogbeteende.

      **Läs mer:**
      [Officiell webbplats](https://weknora.weixin.qq.com)
      [GitHub-länk](https://github.com/Tencent/WeKnora)
    tr_TR: |-
      WeKnora, karmaşık yapılar ve heterojen içeriklere sahip belge senaryoları için özel olarak tasarlanmış, Büyük Dil Modelleri (LLM) tabanlı derin belge anlama ve anlamsal geri alma çerçevesidir. Çok modlu ön işleme, anlamsal vektör indeksleme, akıllı geri alma ve büyük model çıkarımı gibi temel teknolojileri entegre eden modüler bir mimari benimser. Retrieval-Augmented Generation (RAG) paradigmasına dayanarak, bağlama duyarlı, yüksek kaliteli Soru-Cevap yetenekleri sunar. WeKnora, farklı formatlardaki belge içeriğini derinlemesine anlayabilir, ilgili belge parçalarını dil modeli çıkarımıyla birleştirebilir ve doğru, tutarlı anlamsal sonuçlar üretebilir.

      **Temel Özellikler:**
      - WeKnora'nın temel işlevleri, eksiksiz akıllı belge işleme ve Soru-Cevap iş akışını kapsar:
      - Çok Modlu Derin Ayrıştırma: PDF, Word, TXT, görüntüler gibi çeşitli formatlardan yapılandırılmış içerik çıkarımını, OCR görüntü metin tanıma dahil olmak üzere destekler.
      - Anlamsal Vektör İndeksleme ve Akıllı Geri Alma: Vektör geri alma, anahtar kelime geri alma ve hatta bilgi grafiğiyle geliştirilmiş geri alma kombinasyonu aracılığıyla yüksek hassasiyetli anlamsal eşleştirme ve geri çağırma sağlar.
      - RAG Kapalı Döngü Soru-Cevap Üretimi: Büyük dil modeli çıkarımı ve geri alma parçası füzyonundan yararlanarak doğru ve tutarlı içerik yanıtları üretir.
      - Ajan Modu Gelişmiş Yetenekleri: Çok turlu yinelemeler sırasında yerleşik araçları, harici web aramayı vb. çağırabilen ReACT Ajan modunu destekleyerek karmaşık görev işleme yeteneklerini geliştirir.
      - Çok Türlü Bilgi Tabanı Yönetimi: SSS ve belge türü bilgi tabanları oluşturabilir ve etiketleri, dosyaların veya URL'lerin toplu içe aktarımını esnek bir şekilde yönetebilir.
      - Yapılandırılabilir Diyalog Stratejisi ve Kullanıcı Arayüzü: Sezgisel bir Web arayüzü ve REST API sağlar, modellerin, geri alma eşiklerinin ve Prompt'un çevrimiçi ayarlanmasına izin vererek diyalog davranışını kontrol eder.

      **Daha Fazla Bilgi Edinin:**
      [Resmi Web Sitesi](https://weknora.weixin.qq.com)
      [GitHub Bağlantısı](https://github.com/Tencent/WeKnora)
    zh_CN: |-
      WeKnora 是一个基于大语言模型（LLM）的深度文档理解和语义检索框架，专门为具有复杂结构和异构内容的文档场景设计。它采用模块化架构，集成了多模态预处理、语义向量索引、智能检索和大模型推理等关键技术。基于检索增强生成（RAG）范式，实现了上下文感知、高质量的问答能力。WeKnora 能够深度理解不同格式的文档内容，将相关文档片段与语言模型推理相结合，输出准确、连贯的语义结果。

      **主要功能:**
      - WeKnora 的核心功能涵盖了完整的智能文档处理和问答工作流：
      - 多模态深度解析：支持从 PDF、Word、TXT、图片等多种格式中提取结构化内容，包括 OCR 图像文本识别。
      - 语义向量索引与智能检索：通过向量检索、关键词检索，乃至知识图谱增强检索相结合，实现高精度语义匹配和召回。
      - RAG 闭环问答生成：利用大语言模型推理和检索片段融合，生成准确、连贯的内容答案。
      - Agent 模式增强能力：支持 ReACT Agent 模式，可在多轮迭代中调用内置工具、外部网页搜索等，提升复杂任务处理能力。
      - 多类型知识库管理：可创建 FAQ 和文档型知识库，灵活管理标签、批量导入文件或 URL。
      - 可配置对话策略与 UI：提供直观的 Web 界面和 REST API，支持在线调整模型、检索阈值和 Prompt，控制对话行为。

      **了解更多:**
      [官方网站](https://weknora.weixin.qq.com)
      [GitHub 链接](https://github.com/Tencent/WeKnora)
