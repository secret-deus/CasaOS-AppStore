  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko-website
    restart: always
    networks:
      - blinko-net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - target: 1111
        published: "1111"
        protocol: tcp
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://192.168.1.108:1111
      NEXT_PUBLIC_BASE_URL: http://192.168.1.108:1111
      NEXTAUTH_SECRET: 22PhaGVvvBTEC5E5G+U+5O1xqdmuzZKzjLeDMvdvB7I=
      DATABASE_URL: postgresql://postgres:JWD9bxUR7Um9PaGg7FQZ@postgres:5432/postgres
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/blinko_data
        target: /app/.blinko
    logging:
      options:
        max-size: 10m
        max-file: '3'
    x-casaos:
