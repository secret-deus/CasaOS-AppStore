services:
  postgres:
    image: postgres:14
    container_name: blinko-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JWD9bxUR7Um9PaGg7FQZ
      TZ: $TZ
    networks:
      - blinko-net
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -d
        - postgres
      interval: 5s
      timeout: 10s
      retries: 5
    x-casaos:
      envs:
        - container: POSTGRES_DB
          description:
