      [GitHub](https://github.com/openclaw/openclaw)
    pt_PT: |
      OpenClaw é um assistente de IA pessoal de código aberto, concebido para estender as capacidades dos Grandes Modelos de Linguagem (LLMs) a agentes inteligentes que executam tarefas proactivamente, interagem em múltiplas plataformas e operam continuamente. Suporta operação 24/7 nos próprios dispositivos ou servidores do utilizador e fornece serviços de automação inteligentes através de ferramentas de comunicação comuns. O OpenClaw conecta a IA a canais de chat existentes (como WhatsApp, Telegram, Discord, etc.) através de uma arquitetura "gateway + agente" em execução local, permitindo-lhe não só responder a perguntas, mas também executar ações proactivamente, gerir horários, processar e-mails, automatizar fluxos de trabalho e muito mais.

      **Principais Características**:

      - Local-first e Auto-hospedado: O OpenClaw é executado nos próprios dispositivos do utilizador (macOS, Linux, Windows/WSL2) ou em servidores na nuvem, não depende de alojamento na nuvem, os dados permanecem locais, melhorando a privacidade e o controlo.

      - Integração de Comunicação Multicanal: Interaja diretamente com a IA através de plataformas de comunicação comuns como WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams, etc., sem aplicações adicionais.

      - Sempre Ativo e Memória de Longo Prazo: O OpenClaw pode funcionar persistentemente 24/7, possui memória persistente e capacidades de retenção de contexto, pode lembrar preferências, conversas históricas e fornecer serviços personalizados.

      - Execução de Ações Reais: Além das respostas de texto, pode executar tarefas do sistema (por exemplo, limpar a caixa de entrada, enviar e-mails, preencher formulários, agendar compromissos, navegar na web, controlar o navegador, etc.).

      - Expansão de Habilidades e Fluxos de Trabalho Automatizados: Suporta plugins da comunidade, habilidades estendidas e scripts de automação personalizados, permitindo que a IA execute tarefas complexas em vários cenários.

      **Saiba Mais:**

      [Documentação e Guia Oficiais](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    ru_RU: |
      OpenClaw — это персональный AI-ассистент с открытым исходным кодом, разработанный для расширения возможностей больших языковых моделей (LLM) до интеллектуальных агентов, которые проактивно выполняют задачи, взаимодействуют на нескольких платформах и работают непрерывно. Он поддерживает круглосуточную работу на собственных устройствах или серверах пользователя и предоставляет интеллектуальные услуги автоматизации через распространенные средства связи. OpenClaw подключает ИИ к существующим чат-каналам (таким как WhatsApp, Telegram, Discord и т. д.) через локально работающую архитектуру «шлюз + агент», что позволяет ему не только отвечать на вопросы, но и проактивно выполнять действия, управлять расписаниями, обрабатывать электронную почту, автоматизировать рабочие процессы и многое другое.

      **Основные характеристики**:

      - Локальный приоритет и самостоятельное размещение: OpenClaw работает на собственных устройствах пользователя (macOS, Linux, Windows/WSL2) или облачных серверах, не зависит от облачного хостинга, данные остаются локальными, что повышает конфиденциальность и контроль.

      - Многоканальная интеграция связи: Взаимодействуйте напрямую с ИИ через распространенные коммуникационные платформы, такие как WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams и т. д., без дополнительных приложений.

      - Постоянная работа и долгосрочная память: OpenClaw может работать постоянно 24/7, обладает постоянной памятью и возможностями сохранения контекста, может запоминать предпочтения, исторические разговоры и предоставлять персонализированные услуги.

      - Выполнение реальных действий: Помимо текстовых ответов, он может выполнять системные задачи (например, очищать входящие, отправлять электронные письма, заполнять формы, планировать встречи, просматривать веб-страницы, управлять браузером и т. д.).

      - Расширение навыков и автоматизированные рабочие процессы: Поддерживает плагины сообщества, расширенные навыки и пользовательские сценарии автоматизации, позволяя ИИ выполнять сложные задачи в различных сценариях.

      **Узнать больше:**

      [Официальная документация и руководство](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    sv_SE: |
      OpenClaw är en öppen källkods personlig AI-assistent, designad för att utöka kapaciteten hos stora språkmodeller (LLM) till intelligenta agenter som proaktivt utför uppgifter, interagerar över flera plattformar och fungerar kontinuerligt. Den stöder 24/7-drift på användarens egna enheter eller servrar och tillhandahåller intelligenta automationstjänster via vanliga kommunikationsverktyg. OpenClaw ansluter AI till befintliga chattkanaler (som WhatsApp, Telegram, Discord, etc.) genom en lokalt körande "gateway + agent"-arkitektur, vilket gör att den inte bara kan svara på frågor utan också proaktivt utföra åtgärder, hantera scheman, bearbeta e-post, automatisera arbetsflöden och mer.

