    zh_CN: openclaw
  tagline:
    de_DE: OpenClaw ist ein persönlicher KI-Assistent, den Sie auf Ihren eigenen Geräten ausführen.
    el_GR: Το OpenClaw είναι ένας προσωπικός βοηθός τεχνητής νοημοσύνης που εκτελείτε στις δικές σας συσκευές.
    en_GB: OpenClaw is a personal AI assistant you run on your own devices
    en_US: OpenClaw is a personal AI assistant you run on your own devices
    fr_FR: OpenClaw est un assistant IA personnel que vous exécutez sur vos propres appareils.
    hr_HR: OpenClaw je osobni AI asistent kojeg pokrećete na vlastitim uređajima.
    it_IT: OpenClaw è un assistente AI personale che puoi eseguire sui tuoi dispositivi.
    ja_JP: OpenClawは、ご自身のデバイスで実行するパーソナルAIアシスタントです。
    ko_KR: OpenClaw은 사용자의 기기에서 실행되는 개인 AI 비서입니다.
    nb_NO: OpenClaw er en personlig AI-assistent du kjører på dine egne enheter.
    pt_PT: OpenClaw é um assistente de IA pessoal que executa nos seus próprios dispositivos.
    ru_RU: OpenClaw — это персональный ИИ-помощник, который вы запускаете на своих собственных устройствах.
    sv_SE: OpenClaw är en personlig AI-assistent som du kör på dina egna enheter.
    tr_TR: OpenClaw, kendi cihazlarınızda çalıştırdığınız kişisel bir yapay zeka asistanıdır.
    zh_CN: OpenClaw 是一个您在自己的设备上运行的个人 AI 助手。
  description:
    de_DE: |
      OpenClaw ist ein quelloffener persönlicher KI-Assistent, der darauf abzielt, die Fähigkeiten großer Sprachmodelle (LLMs) auf intelligente Agenten zu erweitern, die proaktiv Aufgaben ausführen, plattformübergreifend interagieren und kontinuierlich arbeiten. Er unterstützt den 24/7-Betrieb auf den eigenen Geräten oder Servern des Benutzers und bietet intelligente Automatisierungsdienste über gängige Kommunikationstools. OpenClaw verbindet KI über eine lokal laufende „Gateway+Agent“-Architektur mit bestehenden Chat-Kanälen (wie WhatsApp, Telegram, Discord usw.), sodass er nicht nur Fragen beantworten, sondern auch proaktiv Aktionen ausführen, Termine verwalten, E-Mails bearbeiten, Workflows automatisieren und vieles mehr kann.

      **Hauptmerkmale**:

      - Lokal zuerst & selbst gehostet: OpenClaw läuft auf den eigenen Geräten des Benutzers (macOS, Linux, Windows/WSL2) oder Cloud-Servern, ist nicht auf Cloud-Hosting angewiesen, Daten bleiben lokal, was Datenschutz und Kontrolle verbessert.

      - Mehrkanal-Kommunikationsintegration: Interagieren Sie direkt mit der KI über gängige Kommunikationsplattformen wie WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams usw., ohne zusätzliche Anwendungen.

      - Immer online & Langzeitgedächtnis: OpenClaw kann 24/7 dauerhaft laufen, verfügt über ein persistentes Gedächtnis und Kontextbeibehaltungsfähigkeiten, kann Präferenzen und frühere Gespräche speichern und personalisierte Dienste anbieten.

      - Ausführung realer Aktionen: Neben Textantworten kann er Systemaufgaben ausführen (z. B. Posteingang leeren, E-Mails senden, Formulare ausfüllen, Termine planen, im Web surfen, Browser steuern usw.).

      - Fähigkeitserweiterung & automatisierte Workflows: Unterstützt Community-Plugins, erweiterte Fähigkeiten und benutzerdefinierte Automatisierungsskripte, die es der KI ermöglichen, komplexe Aufgaben in verschiedenen Szenarien auszuführen.

      **Erfahren Sie mehr:**

      [Offizielle Dokumentation und Anleitung](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    el_GR: |
      Το OpenClaw είναι ένας ανοιχτού κώδικα προσωπικός βοηθός AI, σχεδιασμένος να επεκτείνει τις δυνατότητες των Μεγάλων Γλωσσικών Μοντέλων (LLM) σε ευφυείς πράκτορες που εκτελούν προληπτικά εργασίες, αλληλεπιδρούν σε πολλαπλές πλατφόρμες και λειτουργούν συνεχώς. Υποστηρίζει 24/7 λειτουργία στις συσκευές ή τους διακομιστές του χρήστη και παρέχει έξυπνες υπηρεσίες αυτοματισμού μέσω κοινών εργαλείων επικοινωνίας. Το OpenClaw συνδέει την AI με υπάρχοντα κανάλια συνομιλίας (όπως WhatsApp, Telegram, Discord κ.λπ.) μέσω μιας τοπικά εκτελούμενης αρχιτεκτονικής "πύλης + πράκτορα", επιτρέποντάς της όχι μόνο να απαντά σε ερωτήσεις, αλλά και να εκτελεί προληπτικά ενέργειες, να διαχειρίζεται χρονοδιαγράμματα, να επεξεργάζεται email, να αυτοματοποιεί ροές εργασίας κ.λπ.

      **Κύρια Χαρακτηριστικά**:

      - Τοπική προτεραιότητα & αυτο-φιλοξενία: Το OpenClaw λειτουργεί στις συσκευές του χρήστη (macOS, Linux, Windows/WSL2) ή σε διακομιστές cloud, δεν εξαρτάται από φιλοξενία cloud, τα δεδομένα παραμένουν τοπικά, βελτιώνοντας την ιδιωτικότητα και τον έλεγχο.

      - Ενσωμάτωση επικοινωνίας πολλαπλών καναλιών: Αλληλεπιδράστε απευθείας με την AI μέσω κοινών πλατφορμών επικοινωνίας όπως WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams κ.λπ., χωρίς πρόσθετες εφαρμογές.

      - Συνεχής λειτουργία & μακροπρόθεσμη μνήμη: Το OpenClaw μπορεί να λειτουργεί συνεχώς 24/7, διαθέτει μόνιμη μνήμη και δυνατότητες διατήρησης περιβάλλοντος, μπορεί να θυμάται προτιμήσεις, ιστορικές συνομιλίες και να παρέχει εξατομικευμένες υπηρεσίες.

      - Εκτέλεση πραγματικών ενεργειών: Εκτός από τις απαντήσεις κειμένου, μπορεί να εκτελεί εργασίες συστήματος (π.χ. εκκαθάριση εισερχομένων, αποστολή email, συμπλήρωση φορμών, προγραμματισμός ραντεβού, περιήγηση στο διαδίκτυο, έλεγχος προγράμματος περιήγησης κ.λπ.).

      - Επέκταση δεξιοτήτων & αυτοματοποιημένες ροές εργασίας: Υποστηρίζει πρόσθετα κοινότητας, εκτεταμένες δεξιότητες και προσαρμοσμένα σενάρια αυτοματισμού, επιτρέποντας στην AI να εκτελεί σύνθετες εργασίες σε διάφορα σενάρια.

      **Μάθετε περισσότερα:**

      [Επίσημη Τεκμηρίωση και Οδηγίες](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    en_GB: |
      OpenClaw is an open-source personal AI assistant designed to extend the capabilities of Large Language Models (LLMs) into intelligent agents that proactively execute tasks, interact across multiple platforms, and operate continuously. It supports 24/7 operation on the user's own devices or servers and provides intelligent automation services via common communication tools. OpenClaw connects AI to existing chat channels (such as WhatsApp, Telegram, Discord, etc.) through a locally running "gateway + agent" architecture, enabling it to not only answer questions but also proactively perform actions, manage schedules, process emails, automate workflows, and more.

      **Key Features**:

      - Local-first & Self-hosted: OpenClaw runs on the user's own devices (macOS, Linux, Windows/WSL2) or cloud servers, does not rely on cloud hosting, data remains local, enhancing privacy and control.

      - Multi-channel Communication Integration: Interact directly with AI via common communication platforms such as WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams, etc., without additional applications.

      - Always-on & Long-term Memory: OpenClaw can run persistently 24/7, possesses persistent memory and context retention capabilities, can remember preferences, historical conversations, and provide personalised services.

      - Real Action Execution: Besides text replies, it can perform system tasks (e.g., clear inbox, send emails, fill forms, schedule appointments, browse the web, control browser, etc.).

      - Skill Expansion & Automated Workflows: Supports community plugins, extended skills, and custom automation scripts, enabling AI to perform complex tasks in various scenarios.

      **Learn More:**

      [Official Documentation and Guide](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    en_US: |
      OpenClaw 是一个开源的个人 AI 助手，旨在将大型语言模型（LLM）的能力扩展到主动执行任务、跨多平台交互和持续运营的智能代理，它支持在用户自己的设备或服务器上 24/7 运行，并通过常用通讯工具提供智能自动化服务。 OpenClaw 通过一个本地运行的“网关+代理”架构，将 AI 连接到现有的聊天渠道（如 WhatsApp、Telegram、Discord 等），使其不仅能回答问题，还能主动执行操作、管理日程、处理邮件、自动化工作流程等。

      **主要特性**：

      - 本地优先与自托管： OpenClaw 在用户自己的设备（macOS、Linux、Windows/WSL2）或云服务器上运行，不依赖云托管，数据保留在本地，提高隐私与控制权。

      - 多渠道通讯集成： 通过 WhatsApp、Telegram、Slack、Discord、Signal、iMessage、Microsoft Teams 等常用通讯平台直接与 AI 交互，无需额外应用。

      - 持续在线与长期记忆： OpenClaw 可 24/7 常驻运行，拥有持久记忆和上下文保持能力，能记住偏好、历史对话并提供个性化服务。

      - 实际动作执行： 除了文本回复，它可以执行系统任务（如清理收件箱、发送邮件、填写表单、调度日程、浏览网页、控制浏览器等）。

      - 技能扩展与自动化工作流： 支持社区插件、扩展技能和自定义自动化脚本，让 AI 能够在不同场景下执行复杂任务。

      **了解更多：**

      [官方文档和说明](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    fr_FR: |
      OpenClaw est un assistant IA personnel open-source, conçu pour étendre les capacités des grands modèles linguistiques (LLM) à des agents intelligents qui exécutent des tâches de manière proactive, interagissent sur plusieurs plateformes et fonctionnent en continu. Il prend en charge un fonctionnement 24h/24 et 7j/7 sur les propres appareils ou serveurs de l'utilisateur et fournit des services d'automatisation intelligents via des outils de communication courants. OpenClaw connecte l'IA aux canaux de discussion existants (tels que WhatsApp, Telegram, Discord, etc.) grâce à une architecture "passerelle + agent" exécutée localement, lui permettant non seulement de répondre aux questions, mais aussi d'exécuter des actions de manière proactive, de gérer des plannings, de traiter des e-mails, d'automatiser des flux de travail, etc.

      **Caractéristiques principales**:

      - Priorité locale et auto-hébergement: OpenClaw fonctionne sur les propres appareils de l'utilisateur (macOS, Linux, Windows/WSL2) ou sur des serveurs cloud, ne dépend pas de l'hébergement cloud, les données restent locales, améliorant la confidentialité et le contrôle.

      - Intégration de communication multicanal: Interagissez directement avec l'IA via des plateformes de communication courantes telles que WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams, etc., sans applications supplémentaires.

      - Toujours actif et mémoire à long terme: OpenClaw peut fonctionner en permanence 24h/24 et 7j/7, possède une mémoire persistante et des capacités de rétention de contexte, peut se souvenir des préférences, des conversations passées et fournir des services personnalisés.

      - Exécution d'actions réelles: Outre les réponses textuelles, il peut exécuter des tâches système (par exemple, vider la boîte de réception, envoyer des e-mails, remplir des formulaires, planifier des rendez-vous, naviguer sur le web, contrôler le navigateur, etc.).

      - Extension des compétences et flux de travail automatisés: Prend en charge les plugins communautaires, les compétences étendues et les scripts d'automatisation personnalisés, permettant à l'IA d'exécuter des tâches complexes dans divers scénarios.

      **En savoir plus:**

      [Documentation et guide officiels](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    hr_HR: |
      OpenClaw je osobni AI asistent otvorenog koda, dizajniran za proširenje mogućnosti velikih jezičnih modela (LLM) na inteligentne agente koji proaktivno izvršavaju zadatke, interagiraju na više platformi i rade kontinuirano. Podržava 24/7 rad na korisnikovim vlastitim uređajima ili poslužiteljima i pruža inteligentne usluge automatizacije putem uobičajenih komunikacijskih alata. OpenClaw povezuje AI s postojećim chat kanalima (kao što su WhatsApp, Telegram, Discord itd.) putem lokalno pokrenute arhitekture "gateway + agent", omogućujući mu ne samo odgovaranje na pitanja, već i proaktivno izvršavanje radnji, upravljanje rasporedima, obradu e-pošte, automatizaciju radnih procesa i još mnogo toga.

      **Glavne značajke**:

      - Lokalno prvo i samostalno hostirano: OpenClaw radi na korisnikovim vlastitim uređajima (macOS, Linux, Windows/WSL2) ili oblačnim poslužiteljima, ne ovisi o oblačnom hostingu, podaci ostaju lokalni, poboljšavajući privatnost i kontrolu.

      - Integracija višekanalne komunikacije: Izravno komunicirajte s AI putem uobičajenih komunikacijskih platformi kao što su WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams itd., bez dodatnih aplikacija.

      - Uvijek uključen i dugoročno pamćenje: OpenClaw može raditi neprekidno 24/7, posjeduje trajno pamćenje i mogućnosti zadržavanja konteksta, može pamtiti preferencije, povijesne razgovore i pružati personalizirane usluge.

      - Izvršavanje stvarnih radnji: Osim tekstualnih odgovora, može izvršavati sistemske zadatke (npr. čišćenje pristigle pošte, slanje e-pošte, ispunjavanje obrazaca, zakazivanje sastanaka, pregledavanje weba, kontrola preglednika itd.).

      - Proširenje vještina i automatizirani radni procesi: Podržava dodatke zajednice, proširene vještine i prilagođene skripte za automatizaciju, omogućujući AI-u izvršavanje složenih zadataka u različitim scenarijima.

      **Saznajte više:**

      [Službena dokumentacija i vodič](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    it_IT: |
      OpenClaw è un assistente AI personale open source, progettato per estendere le capacità dei modelli linguistici di grandi dimensioni (LLM) a agenti intelligenti che eseguono proattivamente attività, interagiscono su più piattaforme e operano continuamente. Supporta il funzionamento 24 ore su 24, 7 giorni su 7 sui dispositivi o server dell'utente e fornisce servizi di automazione intelligenti tramite strumenti di comunicazione comuni. OpenClaw collega l'IA ai canali di chat esistenti (come WhatsApp, Telegram, Discord, ecc.) tramite un'architettura "gateway + agente" in esecuzione locale, consentendogli non solo di rispondere alle domande, ma anche di eseguire proattivamente azioni, gestire programmi, elaborare e-mail, automatizzare flussi di lavoro e altro ancora.

      **Caratteristiche principali**:

      - Local-first e auto-ospitato: OpenClaw funziona sui dispositivi dell'utente (macOS, Linux, Windows/WSL2) o su server cloud, non dipende dall'hosting cloud, i dati rimangono locali, migliorando la privacy e il controllo.

      - Integrazione della comunicazione multicanale: Interagisci direttamente con l'IA tramite piattaforme di comunicazione comuni come WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams, ecc., senza applicazioni aggiuntive.

      - Sempre attivo e memoria a lungo termine: OpenClaw può funzionare in modo persistente 24 ore su 24, 7 giorni su 7, possiede memoria persistente e capacità di mantenimento del contesto, può ricordare preferenze, conversazioni storiche e fornire servizi personalizzati.

      - Esecuzione di azioni reali: Oltre alle risposte testuali, può eseguire attività di sistema (ad es. svuotare la posta in arrivo, inviare e-mail, compilare moduli, pianificare appuntamenti, navigare sul web, controllare il browser, ecc.).

      - Espansione delle competenze e flussi di lavoro automatizzati: Supporta plugin della community, competenze estese e script di automazione personalizzati, consentendo all'IA di eseguire attività complesse in vari scenari.

      **Scopri di più:**

      [Documentazione e guida ufficiali](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    ja_JP: |
      OpenClawは、大規模言語モデル（LLM）の機能を、タスクを積極的に実行し、複数のプラットフォーム間で対話し、継続的に運用するインテリジェントエージェントに拡張することを目的としたオープンソースの個人AIアシスタントです。ユーザー自身のデバイスまたはサーバーで24時間365日稼働をサポートし、一般的な通信ツールを介してインテリジェントな自動化サービスを提供します。OpenClawは、ローカルで実行される「ゲートウェイ+エージェント」アーキテクチャを通じて、AIを既存のチャットチャネル（WhatsApp、Telegram、Discordなど）に接続し、質問に答えるだけでなく、積極的にアクションを実行したり、スケジュールを管理したり、メールを処理したり、ワークフローを自動化したりすることができます。

      **主な機能**:

      - ローカル優先＆セルフホスト型：OpenClawは、ユーザー自身のデバイス（macOS、Linux、Windows/WSL2）またはクラウドサーバーで動作し、クラウドホスティングに依存せず、データはローカルに保持され、プライバシーと制御が向上します。

      - マルチチャネル通信統合：WhatsApp、Telegram、Slack、Discord、Signal、iMessage、Microsoft Teamsなどの一般的な通信プラットフォームを介してAIと直接対話し、追加のアプリケーションは不要です。

      - 常時稼働＆長期記憶：OpenClawは24時間365日永続的に稼働でき、永続的な記憶とコンテキスト保持機能を備えており、好みや過去の会話を記憶し、パーソナライズされたサービスを提供できます。

      - 実際のアクション実行：テキスト応答に加えて、システムタスク（受信トレイのクリア、メール送信、フォーム入力、スケジュールの設定、ウェブ閲覧、ブラウザ制御など）を実行できます。

      - スキル拡張＆自動化ワークフロー：コミュニティプラグイン、拡張スキル、カスタム自動化スクリプトをサポートし、AIがさまざまなシナリオで複雑なタスクを実行できるようにします。

      **詳細はこちら：**

      [公式ドキュメントとガイド](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    ko_KR: |
      OpenClaw은 대규모 언어 모델(LLM)의 기능을 능동적으로 작업을 실행하고, 여러 플랫폼에서 상호 작용하며, 지속적으로 운영되는 지능형 에이전트로 확장하도록 설계된 오픈 소스 개인 AI 비서입니다. 사용자 자신의 장치 또는 서버에서 24시간 연중무휴 작동을 지원하며, 일반적인 통신 도구를 통해 지능형 자동화 서비스를 제공합니다. OpenClaw은 로컬에서 실행되는 "게이트웨이 + 에이전트" 아키텍처를 통해 AI를 기존 채팅 채널(예: WhatsApp, Telegram, Discord 등)에 연결하여 질문에 답할 뿐만 아니라 능동적으로 작업을 수행하고, 일정을 관리하고, 이메일을 처리하고, 워크플로를 자동화하는 등의 작업을 수행할 수 있습니다.

      **주요 기능**:

      - 로컬 우선 및 자체 호스팅: OpenClaw은 사용자 자신의 장치(macOS, Linux, Windows/WSL2) 또는 클라우드 서버에서 실행되며, 클라우드 호스팅에 의존하지 않고 데이터가 로컬에 유지되어 개인 정보 보호 및 제어 기능이 향상됩니다.

      - 다중 채널 통신 통합: WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams 등과 같은 일반적인 통신 플랫폼을 통해 추가 애플리케이션 없이 AI와 직접 상호 작용합니다.

      - 상시 작동 및 장기 기억: OpenClaw은 24시간 연중무휴로 지속적으로 실행될 수 있으며, 영구적인 기억 및 컨텍스트 유지 기능을 갖추고 있어 선호도, 과거 대화를 기억하고 개인화된 서비스를 제공할 수 있습니다.

      - 실제 작업 실행: 텍스트 응답 외에도 시스템 작업(예: 받은 편지함 정리, 이메일 보내기, 양식 작성, 일정 예약, 웹 검색, 브라우저 제어 등)을 수행할 수 있습니다.

      - 기술 확장 및 자동화 워크플로: 커뮤니티 플러그인, 확장된 기술 및 사용자 지정 자동화 스크립트를 지원하여 AI가 다양한 시나리오에서 복잡한 작업을 수행할 수 있도록 합니다.

      **자세히 알아보기:**

      [공식 문서 및 가이드](https://docs.clawd.bot/)

      [GitHub](https://github.com/openclaw/openclaw)
    nb_NO: |
      OpenClaw er en åpen kildekode personlig AI-assistent, designet for å utvide kapasiteten til store språkmodeller (LLM-er) til intelligente agenter som proaktivt utfører oppgaver, interagerer på tvers av flere plattformer og opererer kontinuerlig. Den støtter 24/7 drift på brukerens egne enheter eller servere og tilbyr intelligente automatiseringstjenester via vanlige kommunikasjonsverktøy. OpenClaw kobler AI til eksisterende chatkanaler (som WhatsApp, Telegram, Discord osv.) gjennom en lokalt kjørende "gateway + agent"-arkitektur, slik at den ikke bare kan svare på spørsmål, men også proaktivt utføre handlinger, administrere tidsplaner, behandle e-poster, automatisere arbeidsflyter og mer.

      **Hovedfunksjoner**:

      - Lokal-først og selv-hostet: OpenClaw kjører på brukerens egne enheter (macOS, Linux, Windows/WSL2) eller skyserver, er ikke avhengig av skyhosting, data forblir lokale, noe som forbedrer personvern og kontroll.

      - Flerkanals kommunikasjonsintegrasjon: Samhandle direkte med AI via vanlige kommunikasjonsplattformer som WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams osv., uten ekstra applikasjoner.

      - Alltid på og langtidshukommelse: OpenClaw kan kjøre vedvarende 24/7, har vedvarende hukommelse og kontekstbevaringsevner, kan huske preferanser, historiske samtaler og tilby personaliserte tjenester.

      - Utførelse av reelle handlinger: I tillegg til tekstsvar kan den utføre systemoppgaver (f.eks. tømme innboks, sende e-poster, fylle ut skjemaer, planlegge avtaler, surfe på nettet, kontrollere nettleser osv.).

      - Ferdighetsutvidelse og automatiserte arbeidsflyter: Støtter fellesskapsplugins, utvidede ferdigheter og tilpassede automatiseringsskript, slik at AI kan utføre komplekse oppgaver i ulike scenarier.

