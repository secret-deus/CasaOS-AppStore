    tr_TR: |
      OpenClaw, Büyük Dil Modellerinin (LLM'ler) yeteneklerini proaktif olarak görevleri yürüten, birden fazla platformda etkileşim kuran ve sürekli çalışan akıllı aracılara genişletmek için tasarlanmış açık kaynaklı bir kişisel yapay zeka asistanıdır. Kullanıcının kendi cihazlarında veya sunucularında 7/24 çalışmayı destekler ve yaygın iletişim araçları aracılığıyla akıllı otomasyon hizmetleri sunar. OpenClaw, yerel olarak çalışan bir "ağ geçidi + aracı" mimarisi aracılığıyla yapay zekayı mevcut sohbet kanallarına (WhatsApp, Telegram, Discord vb. gibi) bağlar, böylece sadece soruları yanıtlamakla kalmaz, aynı zamanda proaktif olarak eylemler gerçekleştirebilir, programları yönetebilir, e-postaları işleyebilir, iş akışlarını otomatikleştirebilir ve daha fazlasını yapabilir.

      **Ana Özellikler**:

      - Yerel öncelikli ve kendi kendine barındırılan: OpenClaw, kullanıcının kendi cihazlarında (macOS, Linux, Windows/WSL2) veya bulut sunucularında çalışır, bulut barındırmaya bağımlı değildir, veriler yerel kalır, bu da gizliliği ve kontrolü artırır.

      - Çok kanallı İletişim Entegrasyonu: WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams vb. gibi yaygın iletişim platformları aracılığıyla yapay zeka ile ek uygulamalara gerek kalmadan doğrudan etkileşim kurun.

      - Her Zaman Açık ve Uzun Süreli Bellek: OpenClaw 7/24 sürekli çalışabilir, kalıcı belleğe ve bağlam koruma yeteneklerine sahiptir, tercihleri, geçmiş konuşmaları hatırlayabilir ve kişiselleştirilmiş hizmetler sunabilir.

      - Gerçek Eylem Yürütme: Metin yanıtlarının yanı sıra, sistem görevlerini (örn. gelen kutusunu temizleme, e-posta gönderme, form doldurma, randevu planlama, web'de gezinme, tarayıcı kontrolü vb.) gerçekleştirebilir.

      - Beceri Genişletme ve Otomatik İş Akışları: Topluluk eklentilerini, genişletilmiş becerileri ve özel otomasyon komut dosyalarını destekler, yapay zekanın çeşitli senaryolarda karmaşık görevleri yerine getirmesini sağlar.

