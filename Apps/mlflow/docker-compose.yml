    ja_JP: |
      MLflowは、機械学習モデルのライフサイクル全体を管理するためのオープンソースプラットフォームです。実験の追跡、コードを再現可能な実行にパッケージ化、モデルの共有と展開のためのツールを提供します。このインストールには、バックエンドストアとしてPostgreSQL、アーティファクトストレージとしてMinIOを使用したMLflow Serverが含まれています。

      **主な機能：**
      - メトリクス、パラメータ、アーティファクトによる実験追跡
      - モデルレジストリとバージョン管理
