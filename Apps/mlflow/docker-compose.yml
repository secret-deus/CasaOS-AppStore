name: mlflow


services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/pgdata
        target: /var/lib/postgresql/data
    ports:
      - target: 5432
        published: "5432"
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mlflow-network
    x-casaos:
      envs:
        - container: POSTGRES_USER
          description:
            de_DE: PostgreSQL-Benutzername
            el_GR: Όνομα χρήστη PostgreSQL
