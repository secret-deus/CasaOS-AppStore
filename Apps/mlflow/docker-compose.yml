    ko_KR: |
      MLflow는 머신러닝 모델의 전체 수명 주기를 관리하기 위한 오픈 소스 플랫폼입니다. 실험 추적, 재현 가능한 실행으로 코드 패키징, 모델 공유 및 배포를 위한 도구를 제공합니다. 이 설치에는 백엔드 저장소로 PostgreSQL, 아티팩트 저장소로 MinIO를 사용하는 MLflow Server가 포함되어 있습니다.

      **주요 기능:**
