  mlflow-network:
    driver: bridge

x-casaos:
  title:
    de_DE: MLflow
    el_GR: MLflow
    en_GB: MLflow
    en_US: MLflow
    fr_FR: MLflow
    hr_HR: MLflow
    it_IT: MLflow
    ja_JP: MLflow
    ko_KR: MLflow
    nb_NO: MLflow
    pt_PT: MLflow
    ru_RU: MLflow
    sv_SE: MLflow
    tr_TR: MLflow
    zh_CN: MLflow
  tagline:
    de_DE: "Maschinelles Lernen-Experiment-Tracking-System"
    el_GR: "Σύστημα παρακολούθησης πειραμάτων μηχανικής μάθησης"
    en_GB: "Machine learning experiment tracking system"
    en_US: "Machine learning experiment tracking system"
    fr_FR: "Système de suivi d'expériences d'apprentissage automatique"
    hr_HR: "Sustav praćenja eksperimenata strojnog učenja"
    it_IT: "Sistema di tracciamento degli esperimenti di machine learning"
    ja_JP: "機械学習実験追跡システム"
    ko_KR: "머신러닝 실험 추적 시스템"
    nb_NO: "Maskinlæring eksperiment sporingssystem"
    pt_PT: "Sistema de rastreio de experiências de aprendizagem automática"
    ru_RU: "Система отслеживания экспериментов машинного обучения"
    sv_SE: "Maskininlärning experiment spårningssystem"
    tr_TR: "Makine öğrenmesi deneme izleme sistemi"
    zh_CN: "机器学习实验跟踪系统"
  description:
    de_DE: |
      MLflow ist eine Open-Source-Plattform zur Verwaltung des gesamten Lebenszyklus von Machine-Learning-Modellen. Es bietet Tools zur Verfolgung von Experimenten, zur Verpackung von Code in reproduzierbare Läufe und zur gemeinsamen Nutzung und Bereitstellung von Modellen. Diese Installation umfasst MLflow Server mit PostgreSQL als Backend-Store und MinIO als Artefakt-Speicher.

      **Hauptfunktionen:**
      - Experiment-Tracking mit Metriken, Parametern und Artefakten
      - Modell-Registrierung und Versionsverwaltung
      - Modelle in verschiedenen Formaten und Frameworks verpacken
      - Modelle für Batch-Inferenz oder als Echtzeit-API bereitstellen
      - Integration mit gängigen ML-Bibliotheken und Frameworks
      - Zentralisierte Benutzeroberfläche für alle ML-Artefakte
      - PostgreSQL für zuverlässige Metadaten-Speicherung
      - MinIO für skalierbare Artefakt-Speicherung

      **Mehr Erfahren:**
      - [MLflow Website](https://mlflow.org)
      - [MLflow GitHub](https://github.com/mlflow/mlflow)
      - [Dokumentation](https://mlflow.org/docs/latest/index.html)

    el_GR: |
      Το MLflow είναι μια πλατφόρμα ανοιχτού κώδικα για τη διαχείριση ολόκληρου του κύκλου ζωής των μοντέλων μηχανικής μάθησης. Παρέχει εργαλεία για την παρακολούθηση πειραμάτων, τη συσκευασία κώδικα σε αναπαραγώγιμες εκτελέσεις και την κοινή χρήση και ανάπτυξη μοντέλων. Αυτή η εγκατάσταση περιλαμβάνει τον MLflow Server με PostgreSQL ως backend store και MinIO ως αποθήκη τεχνητών.

      **Κύρια Χαρακτηριστικά:**
      - Παρακολούθηση πειραμάτων με μετρήσεις, παραμέτρους και τεχνητά
      - Καταχώρηση μοντέλων και διαχείριση εκδόσεων
      - Συσκευασία μοντέλων σε διάφορες μορφές και frameworks
      - Ανάπτυξη μοντέλων για batch inference ή ως πραγματικό χρόνο API
      - Ενσωμάτωση με δημοφιλείς βιβλιοθήκες και frameworks ML
      - Κεντρικοποιημένο περιβάλλον εργασίας για όλα τα ML τεχνητά
      - PostgreSQL για αξιόπιστη αποθήκευση μεταδεδομένων
      - MinIO για κλιμακούμενη αποθήκευση τεχνητών

      **Μάθετε Περισσότερα:**
      - [MLflow Website](https://mlflow.org)
      - [MLflow GitHub](https://github.com/mlflow/mlflow)
      - [Τεκμηρίωση](https://mlflow.org/docs/latest/index.html)

    en_GB: |
      MLflow is an open-source platform for managing the entire lifecycle of machine learning models. It provides tools for tracking experiments, packaging code into reproducible runs, and sharing and deploying models. This installation includes MLflow Server with PostgreSQL as the backend store and MinIO as artifact storage.

      **Key Features:**
      - Experiment tracking with metrics, parameters, and artifacts
      - Model registry and versioning
      - Package models in various formats and frameworks
      - Deploy models for batch inference or as real-time APIs
      - Integration with popular ML libraries and frameworks
      - Centralised interface for all ML artifacts
      - PostgreSQL for reliable metadata storage
      - MinIO for scalable artifact storage

      **Learn More:**
      - [MLflow Website](https://mlflow.org)
      - [MLflow GitHub](https://github.com/mlflow/mlflow)
      - [Documentation](https://mlflow.org/docs/latest/index.html)

    en_US: |
      MLflow is an open-source platform for managing the entire lifecycle of machine learning models. It provides tools for tracking experiments, packaging code into reproducible runs, and sharing and deploying models. This installation includes MLflow Server with PostgreSQL as the backend store and MinIO as artifact storage.

      **Key Features:**
      - Experiment tracking with metrics, parameters, and artifacts
      - Model registry and versioning
      - Package models in various formats and frameworks
      - Deploy models for batch inference or as real-time APIs
      - Integration with popular ML libraries and frameworks
      - Centralized interface for all ML artifacts
      - PostgreSQL for reliable metadata storage
      - MinIO for scalable artifact storage

      **Learn More:**
      - [MLflow Website](https://mlflow.org)
      - [MLflow GitHub](https://github.com/mlflow/mlflow)
      - [Documentation](https://mlflow.org/docs/latest/index.html)

    fr_FR: |
      MLflow est une plateforme open source pour gérer l'ensemble du cycle de vie des modèles d'apprentissage automatique. Il fournit des outils pour suivre les expériences, empaqueter le code en exécutions reproductibles, et partager et déployer des modèles. Cette installation inclut MLflow Server avec PostgreSQL comme magasin de backend et MinIO comme stockage d'artefacts.

