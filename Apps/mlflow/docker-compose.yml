    it_IT: |
      MLflow è una piattaforma open source per gestire l'intero ciclo di vita dei modelli di machine learning. Fornisce strumenti per tracciare esperimenti, impacchettare codice in esecuzioni riproducibili e condividere e distribuire modelli. Questa installazione include MLflow Server con PostgreSQL come backend store e MinIO come archiviazione artefatti.

