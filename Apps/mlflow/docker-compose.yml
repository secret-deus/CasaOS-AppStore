      - 人気のあるMLライブラリとフレームワークとの統合
      - すべてのMLアーティファクトの中央集権化されたインターフェース
      - 信頼性の高いメタデータストレージのためのPostgreSQL
      - スケーラブルなアーティファクトストレージのためのMinIO

