  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    command: [
      "server",
      "/data",
      "--console-address",
      ":9001"]
    ports:
      - target: 9000
        published: "9000"
        protocol: tcp
      - target: 9001
        published: "9001"
        protocol: tcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mlflow-network
    x-casaos:
