      - 다양한 형식과 프레임워크로 모델 패키징
      - 배치 추론 또는 실시간 API로 모델 배포
      - 인기 있는 ML 라이브러리 및 프레임워크와 통합
      - 모든 ML 아티팩트에 대한 중앙 집중식 인터페이스
      - 신뢰할 수 있는 메타데이터 저장을 위한 PostgreSQL
      - 확장 가능한 아티팩트 저장을 위한 MinIO

