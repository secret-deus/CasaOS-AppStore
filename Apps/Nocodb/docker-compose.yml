services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    ports:
    - target: 8080
      published: '880'
      protocol: tcp
    environment:
      NC_DB: pg://db:5432?u=nocodb&p=password&d=nocodb
      NC_PG_HOST: db
      NC_PG_PORT: 5432
      NC_PG_USER: nocodb
      NC_PG_PASSWORD: password
      NC_PG_DATABASE: nocodb
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /usr/app/data
    depends_on:
    - db
    restart: unless-stopped
    x-casaos:
      envs:
      - container: NC_DB
        description:
          de_DE: Database connection URL for NocoDB
          el_GR: Database connection URL for NocoDB
          en_GB: Database connection URL for NocoDB
