  db:
    image: postgres:16.6
    container_name: nocodb_db
    environment:
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nocodb
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/db-data
      target: /var/lib/postgresql/data
    restart: unless-stopped
    x-casaos:
      envs:
      - container: POSTGRES_USER
