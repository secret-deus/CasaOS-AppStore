    tr_TR: Teable
    zh_CN: Teable
  tagline:
    de_DE: Teable verwendet eine prägnante Tabellenkalkulationsoberfläche, erstellt aber leistungsstarke Datenbankanwendungen
    el_GR: Το Teable υιοθετεί μια συνοπτική διεπαφή υπολογιστικού φύλλου, δημιουργεί όμως ισχυρές εφαρμογές βάσεων δεδομένων
    en_GB: Teable adopts a concise spreadsheet interface, yet creates powerful database applications
    en_US: Teable adopts a concise spreadsheet interface, yet creates powerful database applications
    fr_FR: Teable adopte une interface de tableur concise, mais crée des applications de base de données puissantes
    hr_HR: Teable koristi sažeto sučelje proračunske tablice, no stvara moćne aplikacije baze podataka
    it_IT: Teable adotta un'interfaccia foglio di calcolo concisa, ma crea potenti applicazioni di database
    ja_JP: Teableはシンプルなスプレッドシート形式のインターフェースを採用しながら、強力なデータベースアプリケーションを作成できます
    ko_KR: Teable은 간결한 스프레드시트 스타일 인터페이스를 채택하지만 강력한 데이터베이스 애플리케이션을 만들 수 있습니다
    nb_NO: Teable benytter et konsist regnearkgrensesnitt, men skaper kraftfulle databaseapplikasjoner
    pt_PT: O Teable adota uma interface de planilha concisa, mas cria aplicativos de banco de dados poderosos
    ru_RU: Teable использует лаконичный интерфейс электронных таблиц, однако создает мощные приложения баз данных
    sv_SE: Teable använder ett koncisst kalkylbladgränssnitt, men skapar kraftfulla databasapplikationer
    tr_TR: Teable sade ve basit bir elektronik tablo arayüzü kullanır, ancak güçlü veritabanı uygulamaları oluşturur
    zh_CN: Teable采用简洁的电子表格式界面，却能创建功能强大的数据库应用程序
  description:
    de_DE: |
      ## Einführung
      Teable ist eine Open-Source-Datenbankplattform der nächsten Generation. Sie bietet ein intuitives Tabellenkalkulationserlebnis, wird aber von einer leistungsstarken Postgres-Datenbank angetrieben und vereint so einfache Bedienung mit enormer Datenverarbeitungskapazität.

      ## Funktionen
      -   **Hohe Leistung**: Basiert auf dem Postgres-Kernel und verarbeitet mühelos Millionen von Datensätzen mit extrem schneller Reaktionszeit.
      -   **Moderne Benutzeroberfläche**: Unterstützt verschiedene Ansichten wie Raster (Grid), Kanban, Galerie und Formular mit einer benutzerfreundlichen Oberfläche.
      -   **Echtzeit-Zusammenarbeit**: Ermöglicht mehreren Benutzern die gleichzeitige Online-Bearbeitung mit synchroner Datenaktualisierung.
      -   **Automatisierung & API**: Leistungsstarke RESTful und GraphQL APIs für flexible Integrationen und Automatisierungen.
      -   **Airtable-Kompatibilität**: Einfacher Import Ihrer Daten aus Airtable.
      -   **Kostenlos & Open Source**: Volle Kontrolle über Ihre Daten ohne Vendor-Lock-in.

      ## Dokumentation
      [Besuchen Sie die Dokumentation](https://teable.io/docs)
    el_GR: |
      ## Εισαγωγή
      Το Teable είναι μια πλατφόρμα βάσης δεδομένων ανοιχτού κώδικα της επόμενης γενιάς. Παρέχει μια διαισθητική εμπειρία υπολογιστικού φύλλου, αλλά τροφοδοτείται από μια ισχυρή βάση δεδομένων Postgres, συνδυάζοντας την ευκολία χρήσης με τεράστια ισχύ επεξεργασίας δεδομένων.

      ## Λειτουργίες
      -   **Υψηλή Απόδοση**: Βασισμένο στον πυρήνα Postgres, διαχειρίζεται εύκολα εκατομμύρια δεδομένα με εξαιρετικά γρήγορο χρόνο απόκρισης.
      -   **Μοντέρνο Περιβάλλον**: Υποστηρίζει διάφορες προβολές όπως Πλέγμα, Kanban, Συλλογή και Φόρμα με φιλικό περιβάλλον χρήστη.
      -   **Συνεργασία σε Πραγματικό Χρόνο**: Επιτρέπει σε πολλαπλούς χρήστες να επεξεργάζονται ταυτόχρονα με συγχρονισμένη ενημέρωση δεδομένων.
      -   **Αυτοματισμός & API**: Ισχυρά RESTful και GraphQL APIs για ευέλικτες ενσωματώσεις και αυτοματισμούς.
      -   **Συμβατότητα με Airtable**: Εύκολη εισαγωγή των δεδομένων σας από το Airtable.
      -   **Δωρεάν & Open Source**: Πλήρης έλεγχος των δεδομένων σας χωρίς περιορισμούς προμηθευτή.

      ## Τεκμηρίωση
      [Επισκεφθείτε την τεκμηρίωση](https://teable.io/docs)
    en_GB: |
      ## Introduction
      Teable is a next-generation open-source database platform. It provides an intuitive spreadsheet experience but is powered by a high-performance Postgres database, combining ease of use with powerful data processing capabilities.

      ## Features
      -   **High Performance**: Built on Postgres kernel, it effortlessly handles millions of rows of data with extremely fast response times.
      -   **Modern Interface**: Supports various views including Grid, Kanban, Gallery, and Form with a user-friendly interface.
      -   **Real-time Collaboration**: Allows multiple users to edit online simultaneously with synchronous data updates.
      -   **Automation & API**: Powerful RESTful and GraphQL APIs for flexible integrations and automations.
      -   **Airtable Compatibility**: Easily import your data from Airtable.
      -   **Free & Open Source**: Full control over your data without vendor lock-in.

      ## Documentation
      [Visit the documentation](https://teable.io/docs)
    en_US: |
      ## Introduction
      Teable is a next-generation open-source database platform. It provides an intuitive spreadsheet experience but is powered by a high-performance Postgres database, combining ease of use with powerful data processing capabilities.

      ## Features
      -   **High Performance**: Built on Postgres kernel, it effortlessly handles millions of rows of data with extremely fast response times.
      -   **Modern Interface**: Supports various views including Grid, Kanban, Gallery, and Form with a user-friendly interface.
      -   **Real-time Collaboration**: Allows multiple users to edit online simultaneously with synchronous data updates.
      -   **Automation & API**: Powerful RESTful and GraphQL APIs for flexible integrations and automations.
      -   **Airtable Compatibility**: Easily import your data from Airtable.
      -   **Free & Open Source**: Full control over your data without vendor lock-in.

      ## Documentation
      [Visit the documentation](https://teable.io/docs)
    fr_FR: |
      ## Introduction
      Teable est une plateforme de base de données nouvelle génération et open source. Elle offre une expérience intuitive de tableur, mais est propulsée par une base de données Postgres hautes performances, combinant facilité d'utilisation et puissance de traitement des données.

      ## Fonctionnalités
      -   **Haute performance** : Basé sur le noyau Postgres, il gère sans effort des millions de lignes de données avec des temps de réponse extrêmement rapides.
      -   **Interface moderne** : Prend en charge diverses vues, notamment Grille, Kanban, Galerie et Formulaire, avec une interface conviviale.
      -   **Collaboration en temps réel** : Permet à plusieurs utilisateurs de modifier en ligne simultanément avec des mises à jour synchronisées des données.
      -   **Automatisation et API** : API RESTful et GraphQL puissantes pour des intégrations et des automatisations flexibles.
      -   **Compatibilité Airtable** : Importez facilement vos données depuis Airtable.
      -   **Gratuit et Open Source** : Contrôle total de vos données sans dépendance vis-à-vis d'un fournisseur.

      ## Documentation
      [Visitez la documentation](https://teable.io/docs)
    hr_HR: |
      ## Uvod
      Teable je platforma baze podataka nove generacije otvorenog koda. Pruža intuitivno iskustvo proračunske tablice, ali napaja ju baza podataka visoke učinkovitosti Postgres, kombinirajući lakoću korištenja s moćnim mogućnostima obrade podataka.

      ## Značajke
      -   **Visoka učinkovitost**: Izgrađena na jezgri Postgres, bez napora rukuje milijunima redaka podataka s izuzetno brzim vremenima odgovora.
      -   **Moderno sučelje**: Podržava različite prikaze uključujući Mrežu, Kanban, Galeriju i Obrazac s korisničkim sučeljem.
      -   **Suradnja u stvarnom vremenu**: Omogućuje više korisnika da istovremeno uređuju na mreži s sinkroniziranim ažuriranjem podataka.
      -   **Automatizacija i API**: Moćni RESTful i GraphQL API-ji za fleksibilne integracije i automatizacije.
      -   **Kompatibilnost s Airtableom:** Jednostavno uvezite svoje podatke iz Airtablea.
      -   **Besplatno i Open Source**: Potpuna kontrola nad vašim podacima bez ovisnosti o dobavljaču.

      ## Dokumentacija
      [Posjetite dokumentaciju](https://teable.io/docs)
    it_IT: |
      ## Introduzione
      Teable è una piattaforma di database open source di nuova generazione. Offre un'esperienza intuitiva di foglio di calcolo, ma è alimentata da un database Postgres ad alte prestazioni, combinando facilità d'uso e potenti capacità di elaborazione dei dati.

      ## Funzionalità
      -   **Alte prestazioni**: Basato sul kernel Postgres, gestisce senza problemi milioni di righe di dati con tempi di risposta estremamente rapidi.
      -   **Interfaccia moderna**: Supporta varie viste tra cui Griglia, Kanban, Galleria e Modulo con un'interfaccia utente intuitiva.
      -   **Collaborazione in tempo reale**: Consente a più utenti di modificare online simultaneamente con aggiornamenti dati sincronizzati.
      -   **Automazione e API**: Potenti API RESTful e GraphQL per integrazioni flessibili e automazioni.
      -   **Compatibilità Airtable**: Importa facilmente i tuoi dati da Airtable.
      -   **Gratuito e Open Source**: Controllo completo dei tuoi dati senza vincoli fornitore.

      ## Documentazione
      [Visita la documentazione](https://teable.io/docs)
    ja_JP: |
      ## 紹介
      Teableは次世代のオープンソースデータベースプラットフォームです。直感的なスプレッドシート体験を提供しながら、高性能なPostgresデータベースによって駆動されており、使いやすさと強力なデータ処理能力を兼ね備えています。

      ## 機能
      -   **高パフォーマンス**: Postgresカーネルに基づいており、数百万行のデータを極めて高速な応答時間で処理できます。
      -   **モダンなインターフェース**: ユーザーフレンドリーなインターフェースで、グリッド、かんばん、ギャラリー、フォームなどの多様なビューをサポートします。
      -   **リアルタイムコラボレーション**: 複数のユーザーがオンラインで同時に編集でき、データを同期して更新できます。
      -   **自動化とAPI**: 柔軟な統合と自動化のための強力なRESTfulおよびGraphQL API。
      -   **Airtable互換**: Airtableからデータを簡単にインポートできます。
      -   **無料でオープンソース**: ベンダーロックインなしでデータを完全にコントロールできます。

      ## ドキュメント
      [ドキュメントを見る](https://teable.io/docs)
    ko_KR: |
      ## 소개
      Teable은 차세대 오픈 소스 데이터베이스 플랫폼입니다. 직관적인 스프레드시트 환경을 제공하지만, 고성능 Postgres 데이터베이스로 구동되어 사용 편의성과 강력한 데이터 처리 능력을 결합했습니다.

      ## 기능
      -   **고성능**: Postgres 커널 기반으로 수백만 행의 데이터를 극도로 빠른 응답 시간으로 처리합니다.
      -   **현대적 인터페이스**: 사용자 친화적인 인터페이스로 그리드, 칸반, 갤러리, 양식 등 다양한 보기를 지원합니다.
      -   **실시간 협업**: 여러 사용자가 온라인에서 동시에 편집하고 데이터를 동기식으로 업데이트할 수 있습니다.
      -   **자동화 및 API**: 유연한 통합 및 자동화를 위한 강력한 RESTful 및 GraphQL API.
      -   **Airtable 호환성:** Airtable에서 데이터를 쉽게 가져올 수 있습니다.
      -   **무료 및 오픈 소스**: 공급업체 종속성 없이 데이터를 완전히 제어할 수 있습니다.

      ## 문서
      [문서 보기](https://teable.io/docs)
    nb_NO: |
      ## Introduksjon
      Teable er en åpen kilde databaseplattform i neste generasjon. Den tilbyr en intuitiv regnearkopplevelse, men drives av en høytytelses Postgres-database, og kombinerer brukervennlighet med kraftfulle databehandlingsmuligheter.

      ## Funksjoner
      -   **Høy ytelse:** Bygget på Postgres-kjernen, håndterer den uten problemer millioner av datarader med ekstremt raske svartider.
      -   **Moderne grensesnitt:** Støtter ulike visninger, inkludert Rutenett, Kanban, Galleri og Skjema, med et brukervennlig grensesnitt.
      -   **Sanntidssamarbeid:** Tillater flere brukere å redigere online samtidig med synkroniserte dataoppdateringer.
      -   **Automatisering og API:** Kraftige RESTful og GraphQL API-er for fleksible integrasjoner og automatiseringer.
      -   **Airtable-kompatibilitet:** Importer dataene dine enkelt fra Airtable.
      -   **Gratis og Open Source:** Full kontroll over dataene dine uten leverandørlåsing.

      ## Dokumentasjon
      [Besøk dokumentasjonen](https://teable.io/docs)
    pt_PT: |
      ## Introdução
      O Teable é uma plataforma de banco de dados de código aberto de última geração. Ele fornece uma experiência intuitiva de planilha, mas é alimentado por um banco de dados Postgres de alto desempenho, combinando facilidade de uso com poderosos recursos de processamento de dados.

      ## Recursos
      -   **Alto Desempenho**: Construído com o kernel Postgres, ele lida sem esforço com milhões de linhas de dados com tempos de resposta extremamente rápidos.
      -   **Interface Moderna**: Suporta várias visualizações, incluindo Grade, Kanban, Galeria e Formulário, com uma interface amigável.
      -   **Colaboração em Tempo Real**: Permite que múltiplos usuários editem online simultaneamente com atualizações de dados síncronas.
      -   **Automação e API**: APIs RESTful e GraphQL poderosas para integrações e automações flexíveis.
      -   **Compatibilidade com Airtable**: Importe facilmente seus dados do Airtable.
      -   **Gratuito e Open Source**: Controle total sobre seus dados sem bloqueio de fornecedor.

      ## Documentação
      [Visite a documentação](https://teable.io/docs)
    ru_RU: |
      ## Введение
      Teable — это платформа баз данных нового поколения с открытым исходным кодом. Она обеспечивает интуитивно понятный интерфейс электронных таблиц, но работает на базе высокопроизводительной базы данных Postgres, объединяя простоту использования с мощными возможностями обработки данных.

      ## Функции
      -   **Высокая производительность**: Основана на ядре Postgres, с легкостью обрабатывает миллионы строк данных с экстремально быстрым временем отклика.
      -   **Современный интерфейс**: Поддерживает различные представления, включая Сетку, Канбан, Галерею и Форму, с удобным пользовательским интерфейсом.
      -   **Совместная работа в реальном времени**: Позволяет нескольким пользователям редактировать онлайн одновременно с синхронизированным обновлением данных.
      -   **Автоматизация и API**: Мощные RESTful и GraphQL API для гибкой интеграции и автоматизации.
      -   **Совместимость с Airtable**: Легкий импорт данных из Airtable.
      -   **Бесплатно и Open Source**: Полный контроль над вашими данными без привязки к поставщику.

      ## Документация
      [Посетите документацию](https://teable.io/docs)
    sv_SE: |
      ## Introduktion
      Teable är en öppen källkods-databasplattform i nästa generation. Den erbjuder en intuitiv kalkylbladsupplevelse men drivs av en högpresterande Postgres-databas, vilket kombinerar användarvänlighet med kraftfulla databehandlingsmöjligheter.

      ## Funktioner
      -   **Hög prestanda:** Byggd på Postgres-kärnan, hanterar den utan ansträngning miljontals datarader med extremt snabba svarstider.
      -   **Modernt gränssnitt:** Stöder olika vyer inklusive Rutnät, Kanban, Galleri och Formulär med ett användarvänligt gränssnitt.
      -   **Realtidssamarbete:** Tillåter flera användare att redigera online samtidigt med synkroniserade datauppdateringar.
      -   **Automatisering och API:** Kraftfulla RESTful och GraphQL API:er för flexibla integrationer och automatiseringar.
      -   **Airtable-kompatibilitet:** Importera enkelt dina data från Airtable.
      -   **Gratis och Open Source:** Full kontroll över dina data utan leverantörslåsning.

      ## Dokumentation
      [Besök dokumentationen](https://teable.io/docs)
    tr_TR: |
      ## Giriş
      Teable, yeni nesil açık kaynaklı bir veritabanı platformudur. Sezgisel bir elektronik tablo deneyimi sunar ancak yüksek performanslı bir Postgres veritabanı tarafından desteklenir; kullanım kolaylığını güçlü veri işleme yetenekleriyle birleştirir.

      ## Özellikler
      -   **Yüksek Performans**: Postgres çekirdeği üzerine inşa edilmiştir, milyonlarca satır veriyi son derecede hızlı yanıt süreleriyle zahmetsizce işleyebilir.
      -   **Modern Arayüz**: Kullanıcı dostu bir arayüzle Izgara, Kanban, Galeri ve Form gibi çeşitli görünümleri destekler.
      -   **Gerçek Zamanlı İşbirliği**: Çoklu kullanıcının eşzamanlı olarak çevrimiçi düzenlemesine ve verilerin senkronize güncellenmesine izin verir.
      -   **Otomasyon ve API**: Esnek entegrasyonlar ve otomasyonlar için güçlü RESTful ve GraphQL API'leri.
      -   **Airtable Uyumluluğu:** Verilerinizi Airtable'dan kolayca içe aktarın.
      -   **Ücretsiz ve Açık Kaynak**: Tedarikçi kilidi olmadan verilerinizin tam kontrolüne sahip olun.

      ## Dokümantasyon
      [Dokümantasyonu ziyaret edin](https://teable.io/docs)
    zh_CN: |
      ## 简介
      Teable 是新一代的开源数据库平台。它提供了类似电子表格的直观操作体验，但背后由高性能的 Postgres 数据库驱动，兼具了易用性与强大的数据处理能力。

      ## 功能
      -   **高性能**：基于 Postgres 内核，轻松处理百万级数据，响应速度极快。
      -   **现代界面**：提供网格、看板、图库、表单等多种视图，界面简洁易用。
      -   **实时协作**：支持多人在线协同编辑，数据实时同步更新。
      -   **自动化与 API**：提供强大的 RESTful 和 GraphQL API，支持灵活的集成与自动化。
      -   **Airtable 兼容**：支持从 Airtable 一键导入数据。
      -   **免费开源**：完全掌控您的数据，无供应商锁定。

      ## 文档
      [查看文档](https://teable.io/docs)
