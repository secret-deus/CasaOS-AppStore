name: Teable
services:
  teable:
    image: teableio/teable:latest
    container_name: teable
    restart: unless-stopped
    deploy:     
      resources:
        reservations:
          memory: 512M
    ports:
      - target: 3000
        published: "3200"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/assets
        target: /app/.assets
    environment:
      - TZ=$TZ
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - PUBLIC_ORIGIN=http://127.0.0.1:3200 
      - PRISMA_DATABASE_URL=postgresql://example:example@teable-db:5432/teable-db
      - BACKEND_CACHE_PROVIDER=redis
      - BACKEND_CACHE_REDIS_URI=redis://default:password@teable-cache:6379/0
    networks:
      - teable-standalone
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
    x-casaos:
      envs:
        - container: TZ
          description:
            de_DE: Timezone for the application
            el_GR: Timezone for the application
            en_GB: Timezone for the application
            en_US: Timezone for the application
            fr_FR: Timezone for the application
            hr_HR: Timezone for the application
            it_IT: Timezone for the application
            ja_JP: Timezone for the application
            ko_KR: Timezone for the application
            nb_NO: Timezone for the application
            pt_PT: Timezone for the application
            ru_RU: Timezone for the application
            sv_SE: Timezone for the application
            tr_TR: Timezone for the application
            zh_CN: 应用程序的时区
        - container: PRISMA_DATABASE_URL
          description:
            de_DE: Database connection string for Prisma ORM
            el_GR: Database connection string for Prisma ORM
            en_GB: Database connection string for Prisma ORM
            en_US: Database connection string for Prisma ORM
            fr_FR: Database connection string for Prisma ORM
            hr_HR: Database connection string for Prisma ORM
            it_IT: Database connection string for Prisma ORM
            ja_JP: Database connection string for Prisma ORM
            ko_KR: Database connection string for Prisma ORM
            nb_NO: Database connection string for Prisma ORM
            pt_PT: Database connection string for Prisma ORM
            ru_RU: Database connection string for Prisma ORM
            sv_SE: Database connection string for Prisma ORM
            tr_TR: Database connection string for Prisma ORM
            zh_CN: Prisma ORM 的数据库连接字符串
        - container: BACKEND_CACHE_REDIS_URI
          description:
            de_DE: Redis connection URI for caching
            el_GR: Redis connection URI for caching
            en_GB: Redis connection URI for caching
            en_US: Redis connection URI for caching
            fr_FR: Redis connection URI for caching
            hr_HR: Redis connection URI for caching
            it_IT: Redis connection URI for caching
            ja_JP: Redis connection URI for caching
            ko_KR: Redis connection URI for caching
            nb_NO: Redis connection URI for caching
            pt_PT: Redis connection URI for caching
            ru_RU: Redis connection URI for caching
            sv_SE: Redis connection URI for caching
            tr_TR: Redis connection URI for caching
            zh_CN: 用于缓存的 Redis 连接 URI
      ports:
        - container: "3000"
          description:
            de_DE: Main web interface port
            el_GR: Main web interface port
            en_GB: Main web interface port
            en_US: Main web interface port
            fr_FR: Main web interface port
            hr_HR: Main web interface port
            it_IT: Main web interface port
            ja_JP: Main web interface port
            ko_KR: Main web interface port
            nb_NO: Main web interface port
            pt_PT: Main web interface port
            ru_RU: Main web interface port
            sv_SE: Main web interface port
            tr_TR: Main web interface port
            zh_CN: 主 Web 界面端口
      volumes:
        - container: /app/.assets
          description:
            de_DE: Application assets and static files
            el_GR: Application assets and static files
            en_GB: Application assets and static files
            en_US: Application assets and static files
            fr_FR: Application assets and static files
            hr_HR: Application assets and static files
            it_IT: Application assets and static files
            ja_JP: Application assets and static files
            ko_KR: Application assets and static files
            nb_NO: Application assets and static files
            pt_PT: Application assets and static files
            ru_RU: Application assets and static files
            sv_SE: Application assets and static files
            tr_TR: Application assets and static files
            zh_CN: 应用资源文件和静态文件

  teable-db:
    image: postgres:15
    restart: unless-stopped
    container_name: teable-db
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /var/lib/postgresql/data
    environment:
      - TZ=UTC
      - POSTGRES_DB=teable-db
      - POSTGRES_USER=example
      - POSTGRES_PASSWORD=example
    networks:
      - teable-standalone
    healthcheck:
      test:
        - CMD-SHELL
        - sh -c 'pg_isready -U example -d teable-db'
      interval: 10s
      timeout: 3s
      retries: 3
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            de_DE: PostgreSQL password
            el_GR: PostgreSQL password
            en_GB: PostgreSQL password
            en_US: PostgreSQL password
            fr_FR: PostgreSQL password
            hr_HR: PostgreSQL password
            it_IT: PostgreSQL password
            ja_JP: PostgreSQL password
            ko_KR: PostgreSQL password
            nb_NO: PostgreSQL password
            pt_PT: PostgreSQL password
            ru_RU: PostgreSQL password
            sv_SE: PostgreSQL password
            tr_TR: PostgreSQL password
            zh_CN: PostgreSQL 密码
      volumes:
        - container: /var/lib/postgresql/data
          description:
            de_DE: PostgreSQL data storage
            el_GR: PostgreSQL data storage
            en_GB: PostgreSQL data storage
            en_US: PostgreSQL data storage
            fr_FR: PostgreSQL data storage
            hr_HR: PostgreSQL data storage
            it_IT: PostgreSQL data storage
            ja_JP: PostgreSQL data storage
            ko_KR: PostgreSQL data storage
            nb_NO: PostgreSQL data storage
            pt_PT: PostgreSQL data storage
            ru_RU: PostgreSQL data storage
            sv_SE: PostgreSQL data storage
            tr_TR: PostgreSQL data storage
            zh_CN: PostgreSQL 数据存储

  teable-cache:
    image: redis:7.2.4
    restart: unless-stopped
    container_name: teable-cache
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/teable-cache-data
        target: /data
    networks:
      - teable-standalone
    command:
      - redis-server
      - --requirepass
      - password
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 3
    x-casaos:
      volumes:
        - container: /data
          description:
            de_DE: Redis cache data storage
            el_GR: Redis cache data storage
            en_GB: Redis cache data storage
            en_US: Redis cache data storage
            fr_FR: Redis cache data storage
            hr_HR: Redis cache data storage
            it_IT: Redis cache data storage
            ja_JP: Redis cache data storage
            ko_KR: Redis cache data storage
            nb_NO: Redis cache data storage
            pt_PT: Redis cache data storage
            ru_RU: Redis cache data storage
            sv_SE: Redis cache data storage
            tr_TR: Redis cache data storage
            zh_CN: Redis 缓存数据存储

networks:
  teable-standalone:
    driver: bridge

