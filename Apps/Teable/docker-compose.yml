  teable-db:
    image: postgres:15
    restart: always
    container_name: teable-db
    deploy:
      resources:
        reservations:
          memory: 256M
    ports:
    - target: 5432
      published: '42345'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /var/lib/postgresql/data
    environment:
    - TZ=UTC
    - POSTGRES_DB=teable-db
    - POSTGRES_USER=example
    - POSTGRES_PASSWORD=example
    networks:
    - teable-standalone
    healthcheck:
      test:
      - CMD-SHELL
      - sh -c 'pg_isready -U example -d teable-db'
      interval: 10s
      timeout: 3s
      retries: 3
    x-casaos:
      envs:
      - container: TZ
        description:
          de_DE: Timezone for the database
          el_GR: Timezone for the database
          en_GB: Timezone for the database
          en_US: Timezone for the database
