  title:
    de_DE: Teable
    el_GR: Teable
    en_GB: Teable
    en_US: Teable
    fr_FR: Teable
    hr_HR: Teable
    it_IT: Teable
    ja_JP: Teable
    ko_KR: Teable
    nb_NO: Teable
    pt_PT: Teable
    ru_RU: Teable
