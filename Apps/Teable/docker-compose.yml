  teable-cache:
    image: redis:7.2.4
    restart: always
    container_name: teable-cache
    deploy:
      resources:
        reservations:
          memory: 256M
    expose:
    - '6379'
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/teable-cache-data
      target: /data
    networks:
    - teable-standalone
    command: 
      - redis-server 
      - --requirepass password
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
    x-casaos:
      envs: []
      ports: []
      volumes:
      - container: /data
        description:
