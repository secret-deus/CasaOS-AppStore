  tips:
    before_install:
      de_DE: |
        Khoj startet im anonymen Modus, damit die erste Nutzung reibungslos verläuft. Verwenden Sie es nur in einem vertrauenswürdigen Netzwerk oder entfernen Sie `--anonymous-mode`, bevor Sie es öffentlich freigeben.

        Standard-Administratorkonto:

        - E-Mail: `admin@khoj.local`
        - Passwort: `khoj`

        Ändern Sie `KHOJ_ADMIN_PASSWORD` und `KHOJ_DJANGO_SECRET_KEY` für jede gemeinsam genutzte oder produktive Bereitstellung. Nach dem Start können Sie den Modellanbieter in den Khoj-Einstellungen konfigurieren oder über `OPENAI_BASE_URL` auf einen OpenAI-kompatiblen lokalen Server wie Ollama zeigen.
      el_GR: |
        Το Khoj ξεκινά σε ανώνυμη λειτουργία για ομαλή πρώτη χρήση. Κρατήστε το σε αξιόπιστο δίκτυο ή αφαιρέστε το `--anonymous-mode` πριν το εκθέσετε δημόσια.

        Προεπιλεγμένος λογαριασμός διαχειριστή:

        - Email: `admin@khoj.local`
        - Κωδικός: `khoj`

        Αλλάξτε τα `KHOJ_ADMIN_PASSWORD` και `KHOJ_DJANGO_SECRET_KEY` για κοινόχρηστη ή παραγωγική εγκατάσταση. Μετά την εκκίνηση, ρυθμίστε τον πάροχο μοντέλου από τις ρυθμίσεις του Khoj ή δείξτε το `OPENAI_BASE_URL` σε έναν τοπικό διακομιστή συμβατό με OpenAI, όπως το Ollama.
      en_GB: |
        Khoj starts in anonymous mode for a smooth first run. Keep it on a trusted network or remove `--anonymous-mode` before exposing it publicly.

        Default admin account:

        - Email: `admin@khoj.local`
        - Password: `khoj`

        Change `KHOJ_ADMIN_PASSWORD` and `KHOJ_DJANGO_SECRET_KEY` for any shared or production deployment. After launch, configure your model provider from Khoj settings, or point it at an OpenAI-compatible local server such as Ollama through `OPENAI_BASE_URL`.
      en_US: |
        Khoj starts in anonymous mode for a smooth first run. Keep it on a trusted network or remove `--anonymous-mode` before exposing it publicly.

        Default admin account:

        - Email: `admin@khoj.local`
        - Password: `khoj`

        Change `KHOJ_ADMIN_PASSWORD` and `KHOJ_DJANGO_SECRET_KEY` for any shared or production deployment. After launch, configure your model provider from Khoj settings, or point it at an OpenAI-compatible local server such as Ollama through `OPENAI_BASE_URL`.
      fr_FR: |
        Khoj démarre en mode anonyme pour faciliter la première utilisation. Gardez-le sur un réseau de confiance ou supprimez `--anonymous-mode` avant de l’exposer publiquement.

        Compte administrateur par défaut :

        - E-mail : `admin@khoj.local`
        - Mot de passe : `khoj`

        Modifiez `KHOJ_ADMIN_PASSWORD` et `KHOJ_DJANGO_SECRET_KEY` pour tout déploiement partagé ou de production. Après le lancement, configurez votre fournisseur de modèle dans les paramètres Khoj ou pointez `OPENAI_BASE_URL` vers un serveur local compatible OpenAI, comme Ollama.
      hr_HR: |
        Khoj se pokreće u anonimnom načinu rada radi jednostavnog prvog pokretanja. Koristite ga na pouzdanoj mreži ili uklonite `--anonymous-mode` prije javnog izlaganja.

        Zadani administratorski račun:

        - E-pošta: `admin@khoj.local`
        - Lozinka: `khoj`

        Promijenite `KHOJ_ADMIN_PASSWORD` i `KHOJ_DJANGO_SECRET_KEY` za svaku dijeljenu ili produkcijsku instalaciju. Nakon pokretanja konfigurirajte pružatelja modela u postavkama Khoj-a ili usmjerite `OPENAI_BASE_URL` na lokalni OpenAI-kompatibilni poslužitelj kao što je Ollama.
      it_IT: |
        Khoj si avvia in modalità anonima per semplificare il primo utilizzo. Mantienilo su una rete fidata oppure rimuovi `--anonymous-mode` prima di esporlo pubblicamente.

        Account amministratore predefinito:

        - Email: `admin@khoj.local`
        - Password: `khoj`

        Modifica `KHOJ_ADMIN_PASSWORD` e `KHOJ_DJANGO_SECRET_KEY` per qualsiasi distribuzione condivisa o di produzione. Dopo l’avvio, configura il provider del modello dalle impostazioni di Khoj oppure punta `OPENAI_BASE_URL` a un server locale compatibile con OpenAI, come Ollama.
      ja_JP: |
        Khoj は初回利用をスムーズにするため、匿名モードで起動します。信頼できるネットワーク内で使用するか、公開する前に `--anonymous-mode` を削除してください。

        既定の管理者アカウント:

        - メール: `admin@khoj.local`
        - パスワード: `khoj`

        共有環境または本番環境では、`KHOJ_ADMIN_PASSWORD` と `KHOJ_DJANGO_SECRET_KEY` を変更してください。起動後、Khoj の設定でモデルプロバイダーを構成するか、`OPENAI_BASE_URL` を Ollama などの OpenAI 互換ローカルサーバーに向けてください。
      ko_KR: |
        Khoj는 첫 실행을 쉽게 하기 위해 익명 모드로 시작됩니다. 신뢰할 수 있는 네트워크에서만 사용하거나 공개하기 전에 `--anonymous-mode`를 제거하세요.

        기본 관리자 계정:

        - 이메일: `admin@khoj.local`
        - 비밀번호: `khoj`

        공유 또는 운영 배포에서는 `KHOJ_ADMIN_PASSWORD`와 `KHOJ_DJANGO_SECRET_KEY`를 변경하세요. 실행 후 Khoj 설정에서 모델 제공자를 구성하거나 `OPENAI_BASE_URL`을 Ollama 같은 OpenAI 호환 로컬 서버로 지정할 수 있습니다.
      nb_NO: |
        Khoj starter i anonym modus for en enkel første oppstart. Bruk det på et klarert nettverk, eller fjern `--anonymous-mode` før du eksponerer det offentlig.

        Standard administratorkonto:

        - E-post: `admin@khoj.local`
        - Passord: `khoj`

        Endre `KHOJ_ADMIN_PASSWORD` og `KHOJ_DJANGO_SECRET_KEY` for alle delte eller produksjonsbaserte installasjoner. Etter oppstart kan du konfigurere modellleverandøren i Khoj-innstillingene eller peke `OPENAI_BASE_URL` til en OpenAI-kompatibel lokal server som Ollama.
      pt_PT: |
        O Khoj inicia em modo anónimo para uma primeira utilização simples. Mantenha-o numa rede de confiança ou remova `--anonymous-mode` antes de o expor publicamente.

        Conta de administrador predefinida:

        - Email: `admin@khoj.local`
        - Palavra-passe: `khoj`

        Altere `KHOJ_ADMIN_PASSWORD` e `KHOJ_DJANGO_SECRET_KEY` em qualquer instalação partilhada ou de produção. Após o arranque, configure o fornecedor de modelo nas definições do Khoj ou aponte `OPENAI_BASE_URL` para um servidor local compatível com OpenAI, como o Ollama.
      ru_RU: |
        Khoj запускается в анонимном режиме для удобного первого запуска. Используйте его в доверенной сети или удалите `--anonymous-mode` перед публичной публикацией.

        Учетная запись администратора по умолчанию:

        - Email: `admin@khoj.local`
        - Пароль: `khoj`

        Измените `KHOJ_ADMIN_PASSWORD` и `KHOJ_DJANGO_SECRET_KEY` для любого общего или production-развертывания. После запуска настройте поставщика модели в настройках Khoj или укажите `OPENAI_BASE_URL` на локальный OpenAI-совместимый сервер, например Ollama.
      sv_SE: |
        Khoj startar i anonymt läge för en smidig första körning. Använd det i ett betrott nätverk eller ta bort `--anonymous-mode` innan du exponerar det offentligt.

        Standardkonto för administratör:

        - E-post: `admin@khoj.local`
        - Lösenord: `khoj`

        Ändra `KHOJ_ADMIN_PASSWORD` och `KHOJ_DJANGO_SECRET_KEY` för alla delade miljöer eller produktionsmiljöer. Efter start kan du konfigurera modellleverantören i Khoj-inställningarna eller peka `OPENAI_BASE_URL` mot en lokal OpenAI-kompatibel server som Ollama.
      tr_TR: |
        Khoj ilk çalıştırmayı kolaylaştırmak için anonim modda başlar. Güvenilir bir ağda kullanın veya herkese açık hale getirmeden önce `--anonymous-mode` seçeneğini kaldırın.

        Varsayılan yönetici hesabı:

        - E-posta: `admin@khoj.local`
        - Parola: `khoj`

        Paylaşılan veya üretim dağıtımlarında `KHOJ_ADMIN_PASSWORD` ve `KHOJ_DJANGO_SECRET_KEY` değerlerini değiştirin. Başlattıktan sonra model sağlayıcınızı Khoj ayarlarından yapılandırabilir veya `OPENAI_BASE_URL` ile Ollama gibi OpenAI uyumlu yerel bir sunucuya yönlendirebilirsiniz.
      zh_CN: |
        Khoj 默认以匿名模式启动，便于首次运行。请仅在可信网络中使用；若要公网暴露，请先移除 `--anonymous-mode` 并配置认证。

        默认管理员账号：

        - 邮箱：`admin@khoj.local`
        - 密码：`khoj`

        如用于多人共享或生产环境，请修改 `KHOJ_ADMIN_PASSWORD` 和 `KHOJ_DJANGO_SECRET_KEY`。启动后可在 Khoj 设置中配置模型服务，也可以通过 `OPENAI_BASE_URL` 指向 Ollama 等 OpenAI 兼容的本地服务。
